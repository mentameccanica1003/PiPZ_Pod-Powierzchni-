function character(id,pl,en){return `<div class="character"><img src="assets/${id}.webp" alt="${people[id][0]}"><div><strong>${people[id][0]}</strong><p>${T(pl,en)}</p></div></div>`}
function scene(){let s=S.step;
if(s===0)return `<div class="scene">${tag('ODCINEK 2 · NEXORA','EPISODE 2 · NEXORA')}<h1>${T('Dwie wersje prawdy','Two versions of the truth')}</h1><p class="lead">${T('Rola lidera w zarządzaniu konfliktem. Wczorajsza próba budowania zaufania nie wystarczyła. Dziś spór staje się publiczny.','The leader’s role in conflict management. Yesterday’s attempt to build trust was not enough. Today the dispute becomes public.')}</p><div class="panel">${T('Ta historia jest kontynuacją odcinka 1, ale możesz rozpocząć ją samodzielnie. Wybory nie są oceniane jako „dobre” lub „złe”; liczy się ich uzasadnienie.','This story follows episode 1, but you can start independently. Choices are not graded as right or wrong; your reasoning matters.')}</div>${actions(btn(T('Rozpocznij','Begin'))+btn(T('Wznów grę z pliku','Resume from file'),'import',false))}</div>`;
if(s===1)return `<div class="scene">${tag('08:17 · KORESPONDENCJA','08:17 · EMAIL THREAD')}${title('„Nie podpiszę tego raportu”','“I will not sign this report”')}<div class="paper"><strong>Marta · do zespołu, DW: Robert</strong><p>${T('Nie mogę potwierdzić gotowości wdrożenia. Niektóre informacje w raporcie nie mają jeszcze jednoznacznego potwierdzenia w testach. Proszę nie traktować mojego milczenia na spotkaniu jako zgody.','I cannot confirm implementation readiness. Some statements in the report are not yet conclusively supported by tests. Please do not treat my silence at the meeting as consent.')}</p><hr><strong>Robert · odpowiedź do wszystkich · 08:24</strong><p>${T('Nie możemy ponownie blokować projektu zastrzeżeniami zgłaszanymi na ostatniej prostej. Oczekuję propozycji rozwiązania do 11:00.','We cannot block the project again with last-minute objections. I expect a proposed solution by 11:00.')}</p></div>${paragraph('Tomasz pisze prywatnie: „Adam też próbował to rozwiązać. Potem wszyscy przestali ze sobą rozmawiać”. Julia pozostaje milcząca.','Tomasz messages privately: “Adam tried to resolve this too. Then everyone stopped talking.” Julia remains silent.')}${actions(btn(T('Co robisz?','What do you do?')))}</div>`;
if(s===2)return `<div class="scene">${tag('DECYZJA 1 · PIERWSZA INTERWENCJA','DECISION 1 · FIRST INTERVENTION')}${title('Masz mniej niż trzy godziny','You have less than three hours')}${paragraph('Robert oczekuje rozstrzygnięcia. Marta domaga się odnotowania zastrzeżeń. Jaki pierwszy krok wybierasz?','Robert expects a resolution. Marta wants her objections documented. What is your first move?')}${choices('first',[[ 'Zwołuję natychmiastowe wspólne spotkanie i ustalam zasady rozmowy.','Call an immediate joint meeting and set ground rules.'],['Rozmawiam osobno z Martą i Robertem, by ustalić interesy oraz źródła napięcia.','Speak separately with Marta and Robert to identify interests and sources of tension.'],['Proszę Julię o porównanie wersji raportu, zanim wejdę w rozmowę o emocjach.','Ask Julia to compare report versions before discussing emotions.'],['Wydaję tymczasową decyzję o wstrzymaniu potwierdzenia i wyznaczam godzinę przeglądu ryzyk.','Temporarily suspend sign-off and schedule a risk review.']])}${field('first','Dlaczego właśnie tak? Wskaż korzyść i ryzyko swojego kroku.','Why this approach? Identify a benefit and a risk.')}${actions(btn(T('Zatwierdź i przejdź dalej','Confirm and continue'),'decision1'))}</div>`;
if(s===3)return `<div class="scene">${tag('KONFRONTACJA PERSPEKTYW','PERSPECTIVE CHALLENGE')}${title('Trzy głosy, trzy ostrzeżenia','Three voices, three cautions')}${S.mode==='class'?`<div class="panel"><div style="font-size:3.5rem;font-weight:850;color:#ff647d" aria-label="${T('Twój wybór','Your choice')}">${'ABCD'[S.decisions.first??0]}</div>${T('Zatrzymaj historię. Pokaż swoją literę wyboru i przedstaw uzasadnienie, zanim ktokolwiek pozna konsekwencje. Porównajcie: jakie interesy stron chroni każdy wariant, jakie niesie ryzyko eskalacji i które założenia są jeszcze niezweryfikowane? Potem wróć do swojej rozgrywki.','Pause the story. Show your choice letter and explain your reasoning before anyone sees the consequences. Compare which interests each option protects, escalation risks and unverified assumptions. Then return to your own playthrough.')}</div>`:`<div class="panel"><p><strong>Anna · ${T('psycholożka organizacji','organizational psychologist')}:</strong> ${T('„Szybkie spotkanie może otworzyć dialog albo utrwalić publiczne upokorzenie”.','“A quick meeting may restore dialogue or deepen public humiliation.”')}</p><p><strong>Marek · ${T('dyrektor operacyjny','operations director')}:</strong> ${T('„Czas jest realnym kosztem. Nie można rozmawiać bez końca, gdy decyzja ma termin”.','“Time is a real cost. Dialogue cannot continue indefinitely when a decision is due.”')}</p><p><strong>Karolina · ${T('kierowniczka projektu','project manager')}:</strong> ${T('„Dane są ważne, ale nawet bezbłędny arkusz nie naprawi zerwanej współpracy”.','“Evidence matters, but even a flawless spreadsheet will not repair broken cooperation.”')}</p></div>`}${field('perspective','Co w Twoim wyborze może zostać odebrane przez drugą stronę jako niesprawiedliwe?','What might the other party perceive as unfair in your choice?')}${actions(btn(T('Zobacz konsekwencje','Reveal consequences'),'reflectPerspective'))}</div>`;
if(s===4){let k=S.decisions.first||0;let outcomes=[['Na spotkaniu Robert mówi pierwszy. Marta odpowiada ostro. Julia próbuje pokazać dokument, ale obie strony przerywają. Reguły rozmowy trzeba wyegzekwować, nie tylko ogłosić.','Robert speaks first. Marta responds sharply. Julia tries to show a document but both sides interrupt. Ground rules must be enforced, not merely announced.'],['Marta mówi o odpowiedzialności za testy; Robert o zobowiązaniu wobec klienta. Obie strony zgadzają się na rozmowę, ale podejrzewają, że lider obiecał każdej coś innego.','Marta speaks of test accountability; Robert of client commitments. Both agree to talk but suspect the manager promised each something different.'],['Julia znajduje dwie wersje tabeli, lecz nie wie, która była zatwierdzona. Robert odbiera Twoje działanie jako zwłokę; Marta pyta, czy wreszcie zostanie wysłuchana.','Julia finds two table versions but cannot tell which was approved. Robert sees a delay; Marta asks whether she will finally be heard.'],['Robert protestuje przeciw jednostronnemu wstrzymaniu. Marta czuje ulgę, lecz Tomasz ostrzega o kosztach. Musisz wyjaśnić kryteria decyzji i ramy czasowe.','Robert protests the unilateral hold. Marta feels relieved but Tomasz warns of costs. You must explain criteria and time limits.']];return `<div class="scene">${tag('KONSEKWENCJE · NIE MA PROSTEJ WYGRANEJ','CONSEQUENCES · NO EASY WIN')}${title('Cena pierwszego kroku','The cost of the first move')}<div class="panel">${T(...outcomes[k])}</div>${paragraph('Na ekranie pojawia się wiadomość od Julii: „Mam historię zmian. Ale nie potrafię wyjaśnić, dlaczego w raporcie do klienta pominięto jedno zastrzeżenie”.','Julia messages: “I have the change history. But I cannot explain why one objection was omitted from the client report.”')}${actions(btn(T('Otwórz akta konfliktu','Open the conflict file')))}</div>`}
if(s===5)return `<div class="scene">${tag('AKTA · MAPA KONFLIKTU','CASE FILE · CONFLICT MAP')}${title('Pięć źródeł konfliktu','Five sources of conflict')}<div class="panel"><p><strong>${T('Dane','Data')}:</strong> ${T('dwie wersje raportu, niejasne wyniki testów','two report versions, unclear test outcomes')}</p><p><strong>${T('Interesy','Interests')}:</strong> ${T('jakość i bezpieczeństwo wdrożenia kontra termin i wiarygodność wobec klienta','implementation quality and safety versus deadlines and client credibility')}</p><p><strong>${T('Relacje','Relationships')}:</strong> ${T('przerywanie, brak zaufania, publiczne wiadomości','interruptions, mistrust, public emails')}</p><p><strong>${T('Struktura','Structure')}:</strong> ${T('niejasne uprawnienia do zatwierdzenia raportu','unclear authority for report sign-off')}</p><p><strong>${T('Wartości','Values')}:</strong> ${T('odpowiedzialność i rzetelność rozumiane inaczej przez strony','accountability and integrity understood differently')}</p></div>${paragraph('To hipotezy diagnostyczne na podstawie dostępnych informacji, nie wyrok o winie.','These are diagnostic hypotheses based on available information, not findings of guilt.')}${actions(btn(T('Przejdź do rozmowy','Proceed to conversation')))}</div>`;
if(s===6)return `<div class="scene">${tag('DECYZJA 2 · TRUDNA ROZMOWA','DECISION 2 · DIFFICULT CONVERSATION')}${title('„Ona blokuje wszystko”. „On ukrywa ryzyko”.','“She blocks everything.” “He hides the risk.”')}${paragraph('Marta i Robert siedzą naprzeciwko siebie. Tomasz milczy. Jak rozpoczynasz rozmowę?','Marta and Robert sit across from each other. Tomasz stays silent. How do you open?')}${choices('talk',[[ '„Każdy opisze najpierw fakty i to, co jest dla niego ważne. Bez przerywania i przypisywania intencji”.','“Each person will describe the facts and what matters to them. No interruptions or assumed motives.”'],['„Marta, musisz przestać blokować projekt. Robert, postaraj się być spokojniejszy”.','“Marta, stop blocking the project. Robert, try to stay calmer.”'],['„Znajdźmy kompromis: podpiszemy połowę raportu i zamkniemy resztę później”.','“Let’s compromise: sign half the report and close the rest later.”'],['„Robert ma formalną odpowiedzialność. Niech więc rozstrzygnie spór”.','“Robert has formal responsibility. Let him decide the dispute.”']])}${field('talk','Jaką rolę pełnisz tutaj jako lider: strona, trzecia strona czy decydent? Uzasadnij.','Which role are you taking: party, third party or decision-maker? Explain.')}${actions(btn(T('Zatwierdź','Confirm'),'decision2'))}</div>`;
if(s===7){let k=S.decisions.talk||0;let outcomes=[['Marta opisuje niezakończony test. Robert przyznaje, że nie znał statusu jednego załącznika. Napięcie nie znika, ale rozmowa wraca do problemu.','Marta describes an incomplete test. Robert admits he did not know the status of an appendix. Tension remains, but the discussion returns to the problem.'],['Marta zamyka notatnik. „Znowu to ja jestem problemem”. Robert uważa, że lider nie rozumie presji klienta.','Marta closes her notebook. “Once again I am the problem.” Robert thinks the manager does not understand client pressure.'],['Tomasz pyta, co oznacza „połowa raportu”. Julia wskazuje, że krytyczne zastrzeżenie nie daje się podzielić na pół.','Tomasz asks what “half a report” means. Julia notes that a critical objection cannot simply be split in half.'],['Robert ogłasza termin, ale Marta odmawia potwierdzenia danych, za które odpowiada. Spór przenosi się na odpowiedzialność formalną.','Robert announces a deadline, but Marta refuses to sign off on data she owns. The dispute shifts to formal accountability.']];return `<div class="scene">${tag('KONSEKWENCJE · ROZMOWA','CONSEQUENCES · THE CONVERSATION')}${title('Czy rozwiązujesz konflikt, czy go uciszasz?','Are you resolving the conflict or silencing it?')}<div class="panel">${T(...outcomes[k])}</div>${paragraph('Julia przesyła zrzut historii wersji. W pliku widnieje wpis: „Zastrzeżenie Q-17 — status: do wyjaśnienia”. W wersji przekazanej klientowi wiersza nie ma. Nie wiadomo, kto i dlaczego go usunął.','Julia sends a version-history extract. One entry reads: “Objection Q-17 — status: pending clarification.” The client-facing version lacks that row. Who removed it, and why, is unknown.')}${actions(btn(T('Przejdź do negocjacji','Proceed to negotiation')))}</div>`}
if(s===8)return `<div class="scene">${tag('PRZYGOTOWANIE · NEGOCJACJE','PREPARATION · NEGOTIATION')}${title('Nie negocjujemy prawdy o testach','We do not negotiate the truth about tests')}${paragraph('Robert chce dotrzymać terminu. Marta chce, by żadne niepotwierdzone twierdzenie nie trafiło do klienta. Ustal warunki, a nie pozory zgody.','Robert wants to meet the deadline. Marta wants no unsupported claims sent to the client. Negotiate conditions, not the appearance of agreement.')}<div class="panel"><strong>BATNA</strong> — ${T('najlepsza realistyczna alternatywa bez porozumienia','best realistic alternative without agreement')}<br><strong>WATNA</strong> — ${T('najgorszy realistyczny scenariusz braku porozumienia','worst realistic no-agreement scenario')}</div>${field('batna','Jaka może być BATNA NEXORY? Uwzględnij koszty i realność.','What might NEXORA’s BATNA be? Consider costs and feasibility.')}${field('watna','Jaka może być WATNA NEXORY?','What might NEXORA’s WATNA be?')}${actions(btn(T('Przejdź do propozycji','Proceed to proposal'),'requirePrep'))}</div>`;
if(s===9)return `<div class="scene">${tag('DECYZJA 3 · POROZUMIENIE','DECISION 3 · AGREEMENT')}${title('Co zaproponujesz do 11:00?','What will you propose by 11:00?')}${choices('agreement',[[ 'Wspólna weryfikacja Q-17, pisemne kryteria zatwierdzenia, komunikat do klienta z aktualnym statusem i odpowiedzialnymi osobami.','Joint Q-17 verification, written sign-off criteria, an accurate client update and named owners.'],['Obietnica, że wszyscy podpiszą raport po krótkiej przerwie.','A promise that everyone will sign after a short break.'],['Przesunięcie całego wdrożenia bez konsultacji i bez planu.','Postpone the entire launch without consultation or a plan.'],['Wysłanie obecnej wersji raportu i prywatna prośba do Marty, aby nie eskalowała.','Send the current report and privately ask Marta not to escalate.']])}${field('agreement','Jakie interesy zabezpieczasz? Co nadal pozostaje nierozstrzygnięte?','Which interests are protected? What remains unresolved?')}${actions(btn(T('Zatwierdź plan','Confirm plan'),'decision3'))}</div>`;
if(s===10){let k=S.decisions.agreement||0;let outcomes=[['Robert akceptuje przegląd do 15:00 pod warunkiem natychmiastowego komunikatu do klienta. Marta zgadza się zweryfikować Q-17. To warunkowe porozumienie, nie dowód, że raport był poprawny.','Robert accepts a review by 15:00 if the client receives an immediate update. Marta agrees to verify Q-17. This is a conditional agreement, not proof the report was correct.'],['Marta odmawia deklaracji bez weryfikacji. Robert mówi, że stracił czas. Napięcie wraca.','Marta refuses to commit without verification. Robert says time has been wasted. Tension returns.'],['Tomasz pyta, kto poinformuje klienta i na jakiej podstawie. Niejasność decyzji zwiększa koszty.','Tomasz asks who will inform the client and on what basis. An unclear decision increases costs.'],['Marta przesyła formalne zastrzeżenie. Julia archiwizuje różnice wersji. Robert jest zadowolony z tempa, ale problem pozostaje.','Marta files a formal objection. Julia archives the version differences. Robert is pleased with the speed, but the issue remains.']];return `<div class="scene">${tag('KONSEKWENCJE · 11:06','CONSEQUENCES · 11:06')}${title('Porozumienie czy zawieszenie broni?','Agreement or ceasefire?')}<div class="panel">${T(...outcomes[k])}</div>${paragraph('Na końcu spotkania Julia pyta: „Czy ktoś sprawdził, dlaczego Adam zapisał Q-17 w prywatnym archiwum?”. Nikt nie odpowiada.','At the end Julia asks: “Has anyone checked why Adam kept Q-17 in his private archive?” No one answers.')}${actions(btn(T('Poznaj narzędzia lidera','Review leadership tools')))}</div>`}
if(s===11)return `<div class="scene">${tag('BAZA WIEDZY · 1/2','LEARNING FILE · 1/2')}${title('Rozpoznaj konflikt, zanim wybierzesz interwencję','Diagnose before intervening')}<div class="panel"><h3>${T('Koło konfliktu Moore’a','Moore’s circle of conflict')}</h3>${paragraph('Pięć źródeł: dane, relacje, wartości, interesy i struktura. Często współwystępują. Dobieraj interwencję do źródła: wspólne dane, rozmowa o interesach, zasady dialogu, uzgodnienie wartości lub korekta ról i procedur.','Five sources: data, relationships, values, interests and structure. They often overlap. Match intervention to the source: shared evidence, interest-based dialogue, conversation rules, shared principles or clearer roles.')}</div><div class="panel"><h3>${T('Crawley: sygnały eskalacji','Crawley: escalation warnings')}</h3>${paragraph('Iskra → zbieranie „amunicji” → eksplozja → naprawa szkód. Uważaj na polaryzację, maile z DW, sarkazm, przypisywanie intencji i zbieranie sojuszników. Wczesna interwencja może zmienić tor konfliktu.','Spark → ammunition gathering → explosion → damage repair. Watch for polarization, CC emails, sarcasm, mind-reading and alliance-building. Early intervention can change the course.')}</div><div class="panel"><h3>${T('Stanowiska, interesy, potrzeby i wartości','Positions, interests, needs and values')}</h3>${paragraph('„Nie podpiszę” to stanowisko. „Chcę mieć pewność, że klient dostanie rzetelne dane” odsłania interes. Nie zakładaj, że stanowisko wyczerpuje motywację strony.','“I will not sign” is a position. “I need confidence that the client receives accurate information” reveals an interest. A stated position does not exhaust someone’s motives.')}</div>${actions(btn(T('Dalej','Continue')))}</div>`;
if(s===12)return `<div class="scene">${tag('BAZA WIEDZY · 2/2','LEARNING FILE · 2/2')}${title('Dobierz rolę i narzędzie','Choose your role and tool')}<div class="panel"><h3>Thomas–Kilmann</h3>${paragraph('Pięć stylów: rywalizacja, współpraca, kompromis, unikanie, dostosowanie. Żaden nie jest uniwersalny; dobór zależy od stawki, czasu, relacji i możliwości współdziałania.','Five modes: competing, collaborating, compromising, avoiding and accommodating. None is universally best; choose based on stakes, time, relationships and ability to cooperate.')}</div><div class="panel"><h3>${T('Trzy role lidera','Three leader roles')}</h3>${paragraph('Lider może być stroną, trzecią stroną wspierającą dialog albo decydentem. Nie deklaruj pełnej neutralności mediatora, jeśli sam masz interes w wyniku lub władzę rozstrzygnięcia.','A leader may be a party, a third party supporting dialogue, or a decision-maker. Do not claim full mediator neutrality if you have a stake or decision authority.')}</div><div class="panel"><h3>${T('Negocjacje i mediacja','Negotiation and mediation')}</h3>${paragraph('Negocjacje: przygotowanie (w tym BATNA/WATNA), otwarcie, rozmowy właściwe, zamknięcie i ocena. Mediacja: dobrowolność, poufność, bezstronność i odpowiedzialność stron za porozumienie. Przełamuj impas przez wspólne interesy, informacje i otwarte pytania.','Negotiation: preparation (including BATNA/WATNA), opening, bargaining, closing and evaluation. Mediation: voluntariness, confidentiality, impartiality and party ownership of outcomes. Break impasses through shared interests, information and open questions.')}</div>${actions(btn(T('Sprawdź wiedzę · 8 obszarów','Knowledge check · 8 areas')))}</div>`;
if(s===13){let i=Object.keys(S.quiz).filter(k=>S.quiz[k].done).length;if(i>=AREAS.length)return `<div class="scene">${title('Test zakończony','Quiz complete')}${actions(btn(T('Dalej','Continue')))}</div>`;let q=S.quiz[i]||{attempt:0,done:false};let a=AREAS[i],v=a[2][Math.min(2,q.attempt)],o=[[v[2],v[3]],[v[4],v[5]],[v[6],v[7]]];let order=[1,2,0];if(i%3===1)order=[0,2,1];if(i%3===2)order=[2,0,1];return `<div class="scene">${tag('TEST UCZĄCY · '+(i+1)+'/8','LEARNING QUIZ · '+(i+1)+'/8')}${title(a[0],a[1])}<p class="lead">${T(v[0],v[1])}</p>${order.map((j,k)=>`<button class="btn choice" data-quiz="${i}" data-answer="${j}" ${S.quizFeedback&&S.quizFeedback.area===i?'disabled':''}><strong>${'ABC'[k]}.</strong> ${esc(T(...o[j]))}</button>`).join('')}<div class="panel">${T('Przy błędzie zobaczysz wyjaśnienie i kolejne pytanie z tego obszaru. Po trzech błędach wrócisz do teorii i spróbujesz ponownie.','After an error you will see an explanation and a different question in the area. After three errors you will revisit theory and try again.')}</div>${S.quizFeedback&&S.quizFeedback.area===i?`<div id="feedback" class="panel" role="status" aria-live="polite"><strong>${S.quizFeedback.correct?T('Dobrze!','Correct!'):T('Nie tym razem','Not quite')}</strong><p>${esc(S.quizFeedback.explanation)}</p>${actions(btn(S.quizFeedback.correct?T('Przejdź do kolejnego obszaru','Continue to next topic'):S.quizFeedback.review?T('Powtórz teorię','Review the theory'):T('Nowe pytanie','New question'),S.quizFeedback.correct?'quizContinue':S.quizFeedback.review?'quizReview':'quizRetry'))}</div>`:''}</div>`}
if(s===14)return `<div class="scene">${tag('REFLEKSJA INDYWIDUALNA','INDIVIDUAL REFLECTION')}${title('Nie tylko zakończyć spór','Not merely end the dispute')}${field('reflection1','1. Wskaż źródła konfliktu według Moore’a. Oddziel obserwacje od hipotez.','1. Identify sources using Moore’s model. Separate observations from hypotheses.')}${field('reflection2','2. Który z Twoich kroków mógł eskalować konflikt i jak zmienił(a)byś go dziś?','2. Which of your actions could escalate the conflict, and how would you change it?')}${field('reflection3','3. Podaj trzy konkretne działania na najbliższy tydzień, osoby odpowiedzialne i wskaźniki skuteczności.','3. Give three concrete actions for next week, owners and effectiveness indicators.')}${field('reflection4','4. Kiedy lider powinien być trzecią stroną, a kiedy decydentem? Jakie są granice jego bezstronności?','4. When should a leader be a third party and when a decision-maker? What limits their impartiality?')}${actions(btn(T('Zapisz refleksję','Save reflection'),'reflection'))}</div>`;
if(s===15)return `<div class="scene">${tag('17:42 · NIEZNANY NADAWCA','17:42 · UNKNOWN SENDER')}${title('Jeszcze jedna wersja','One more version')}<div class="paper"><p>${T('„Wszyscy pytają, kto usunął Q-17. Nikt nie pyta, kto zdecydował, że test ma się odbyć dopiero po wysłaniu raportu”.','“Everyone asks who removed Q-17. No one asks who decided the test should take place only after the report was sent.”')}</p><small>${T('Nadawca nieznany. Brak możliwości odpowiedzi.','Unknown sender. No reply possible.')}</small></div>${paragraph('W folderze Adama pojawia się nazwa pliku: „Q-17 — harmonogram pierwotny”. Nie możesz jeszcze go otworzyć.','A filename appears in Adam’s folder: “Q-17 — original schedule”. You cannot open it yet.')}${actions(btn(T('Przejdź do podsumowania','Continue to summary')))}</div>`;
if(s===16)return `<div class="scene">${tag('RAPORT · ODCINEK 2','REPORT · EPISODE 2')}${title('Twój ślad decyzyjny','Your decision trail')}${paragraph('Zachowaj postęp w pliku i wygeneruj raport PDF. Ocena dotyczy jakości argumentacji i refleksji, nie samego wyboru litery.','Save progress to a file and generate a PDF report. Assessment concerns reasoning and reflection, not the letter chosen.')}<div class="panel">${T('Kryteria oceny prowadzącego (0–2 pkt każde): teoria, diagnoza sytuacji, ryzyka, fakty a hipotezy, spójność działań. Próg: 7/10, w tym co najmniej 1 pkt za teorię i krytyczne myślenie.','Instructor rubric (0–2 each): theory, situation diagnosis, risks, facts versus hypotheses, coherence. Pass: 7/10, including at least 1 point for theory and critical thinking.')}</div>${actions(btn(T('Raport PDF','PDF report'),'pdf')+btn(T('Zapisz postęp do pliku','Save progress to file'),'download',false)+btn(T('Zakończ','Finish'),'finish',false))}</div>`;
if(s===17)return `<div class="scene">${title('Koniec odcinka 2','End of episode 2')}${paragraph('Konflikt nie został magicznie rozwiązany. Udało Ci się jednak zobaczyć, jak sposób interwencji wpływa na dane, relacje i odpowiedzialność. W odcinku 3 przyjrzymy się temu, dlaczego ludzie przestają się angażować.','The conflict was not magically resolved. You have seen how intervention affects evidence, relationships and accountability. Episode 3 will explore why people disengage.')}${actions(btn(T('Zapisz postęp do pliku','Save progress to file'),'download')+btn(T('Raport PDF','PDF report'),'pdf',false))}</div>`;
return `<div class="scene">${actions(btn(T('Wróć','Back'),'back'))}</div>`}
function render(){document.documentElement.lang=S.lang;document.documentElement.style.setProperty('--size',S.font/100);$('fontval').textContent=S.font+'%';$('lang').textContent=S.lang==='pl'?'EN':'PL';$('about').textContent=T('O NEXORZE','About NEXORA');$('dossier').textContent=T('Akta postaci','Character files');$('episode').textContent=T('POD POWIERZCHNIĄ · ODCINEK 2','BELOW THE SURFACE · EPISODE 2');$('stage').innerHTML=scene();$('status').innerHTML=`${T('Etap','Step')} ${Math.min(18,S.step+1)}/18 · ${T('Tryb','Mode')}: <button class="smallbtn" data-act="mode">${S.mode==='class'?T('Zajęcia','Classroom'):T('Samodzielnie','Solo')}</button> · ${btn(T('Zapisz postęp do pliku','Save progress to file'),'download',false)} ${btn(T('Wznów grę z pliku','Resume from file'),'import',false)}`;if(S.saveNotice){$('status').insertAdjacentHTML('beforeend',`<span class="save-confirm" role="status">${T(' · Przygotowano plik zapisu — sprawdź folder Pobrane.',' · Save file prepared — check Downloads.')}</span>`)}$('foot').textContent='NEXORA · Fikcyjna symulacja edukacyjna / Fictional educational simulation';persist()}
function showModal(type){$('modalTitle').textContent=type==='about'?T('O NEXORZE','About NEXORA'):T('Akta postaci','Character files');$('modalBody').innerHTML=type==='about'?`<div class="abouttext"><p>${T('NEXORA jest fikcyjną firmą technologiczną wdrażającą system raportowania operacji i jakości. Kontrakt z dużym klientem jest zagrożony opóźnieniem, a część testów i rozbieżności w dokumentacji pozostaje niewyjaśniona. Robert odpowiada za zobowiązania, Marta za jakość, Tomasz za harmonogram, Julia za analizę danych. Poprzedni kierownik Adam odszedł trzy tygodnie przed rozpoczęciem historii.','NEXORA is a fictional technology company implementing an operations and quality reporting system. A major client contract faces delay while some tests and documentation discrepancies remain unresolved. Robert is accountable for commitments, Marta for quality, Tomasz for the schedule and Julia for data analysis. Former manager Adam left three weeks before the story began.')}</p></div>`:`<div class="dossiergrid"><div class="personcard"><div class="details"><strong>${T('TY — NOWY KIEROWNIK','YOU — NEW MANAGER')}</strong><p>${T('Podejmujesz decyzje i odpowiadasz za ich uzasadnienie.','You make decisions and justify them.')}</p></div></div>${Object.keys(people).map(id=>`<div class="personcard"><img src="assets/${id}.webp" alt=""><div class="details"><strong>${people[id][0]}</strong><p>${S.lang==='pl'?people[id][1]:people[id][2]}</p><p>${S.lang==='pl'?people[id][3]:people[id][4]}</p></div></div>`).join('')}</div>`;$('modal').showModal()}
function exportSave(){let data={...S,project:'NEXORA',format:'nexora-progress',version:1,exportedAt:new Date().toISOString(),cumulativeHistory:[...(Array.isArray(S.parent?.cumulativeHistory)?S.parent.cumulativeHistory:[S.parent?{episode:1,data:S.parent}:null].filter(Boolean)),{episode:2,decisions:S.decisions,notes:S.notes,quiz:S.quiz,quizHistory:S.history}]};let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='nexora-odcinek-2-zapis.json';a.click();S.saveNotice=true;persist();render();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importSave(file){let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data||typeof data!=='object')throw Error('Invalid file');if(data.episode===2){S={...init(),...data,history:(!Array.isArray(data.history)&&data.history&&typeof data.history==='object')?data.history:{},font:Math.max(100,Math.min(200,Number(data.font)||100))};}else if(data.episode===1||data.project==='NEXORA'&&data.episode===1){if(S.parent&&!confirm(T('Zastąpić zapis z poprzedniego odcinka?','Replace previous episode save?')))return;S.parent=data;S.canonical={episode:1,choice:data.choice??null};alert(T('Zaimportowano historię odcinka 1. Możesz rozpocząć odcinek 2.','Episode 1 history imported. You can begin episode 2.'));}else throw Error('Not a NEXORA episode 1 or 2 save');persist();render()}catch(e){alert(T('Nie udało się odczytać zapisu NEXORA.','Could not read a NEXORA save.'))}};r.readAsText(file)}
function report(){let fmt=(v)=>esc(String(v??''));let labels=['first','talk','agreement'];let body=`<h1>NEXORA — ${T('Odcinek 2: Dwie wersje prawdy','Episode 2: Two versions of the truth')}</h1><p>${new Date().toLocaleString()}</p><h2>${T('Decyzje i uzasadnienia','Decisions and rationales')}</h2>`;for(let k of labels)body+=`<h3>${k}: ${'ABCD'[S.decisions[k]??0]||'—'}</h3><p>${fmt(S.notes[k])}</p>`;body+=`<h2>${T('Pozostałe odpowiedzi i refleksje','Additional responses and reflections')}</h2>`;for(let [k,v]of Object.entries(S.notes))if(!labels.includes(k))body+=`<h3>${fmt(k)}</h3><p style="white-space:pre-wrap">${fmt(v)}</p>`;body+=`<h2>${T('Test wiedzy','Knowledge check')}</h2>`;for(let [i,a]of AREAS.entries())body+=`<p>${fmt(a[S.lang==='pl'?0:1])}: ${S.quiz[i]?.done?T('zaliczone','completed'):T('niezaliczone','not completed')} · ${T('próby','attempts')}: ${fmt(S.history[i]?.length||0)}</p>`;body+=`<h2>${T('Kryteria prowadzącego','Instructor rubric')}</h2><p>${T('Teoria 0–2; diagnoza 0–2; ryzyka 0–2; fakty/hipotezy 0–2; spójność 0–2. Próg 7/10; co najmniej 1 punkt za teorię i fakty/hipotezy.','Theory 0–2; diagnosis 0–2; risks 0–2; facts/hypotheses 0–2; coherence 0–2. Pass 7/10, with at least 1 point in theory and facts/hypotheses.')}</p>`;let w=window.open('','_blank');if(!w){alert(T('Zezwól przeglądarce na otwieranie okien, aby zapisać PDF.','Allow pop-ups to save the PDF.'));return}w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>NEXORA episode 2 report</title><style>body{font:15px/1.55 Arial,sans-serif;max-width:820px;margin:35px auto;padding:20px;color:#172334}h1{font-size:26px}h2{border-bottom:1px solid #aaa;padding-top:15px}p{overflow-wrap:anywhere}@media print{body{margin:0;padding:0}}</style></head><body>'+body+'<p>'+T('Wydrukuj → Zapisz jako PDF','Print → Save as PDF')+'</p></body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),350)}
$('stage').addEventListener('input',e=>{if(e.target.dataset.note){S.notes[e.target.dataset.note]=e.target.value;persist()}});
$('stage').addEventListener('click',e=>{let q=e.target.closest('[data-quiz]');if(q){let i=Number(q.dataset.quiz),answer=Number(q.dataset.answer),entry=S.quiz[i]||{attempt:0,done:false},v=AREAS[i][2][Math.min(2,entry.attempt)];S.history[i]??=[];S.history[i].push({attempt:entry.attempt+1,correct:answer===0,question:v[0]});let explanation=T(v[8],v[9]);if(answer===0){S.quiz[i]={done:true,attempt:entry.attempt};S.quizFeedback={area:i,correct:true,explanation,review:false};}else{let a=entry.attempt+1;S.quiz[i]={done:false,attempt:a>=3?0:a};S.quizFeedback={area:i,correct:false,explanation:explanation+(a>=3?T(' Wróć do teorii i spróbuj ponownie.',' Review the theory and try again.') : ''),review:a>=3};}persist();render();return} let c=e.target.closest('[data-choice]');if(c){S.decisions[c.dataset.choice]=Number(c.dataset.val);persist();render();return}let b=e.target.closest('[data-act]');if(b)handle(b.dataset.act)});
$('status').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b)handle(b.dataset.act)});
function requireText(keys){for(let k of keys)if((S.notes[k]||'').trim().length<15){alert(T('Uzupełnij wszystkie wymagane odpowiedzi (minimum 15 znaków każda).','Complete all required responses (at least 15 characters each).'));return false}return true}
function handle(a){if(a!=='download')S.saveNotice=false;if(a==='quizContinue'){S.quizFeedback=null;if(Object.values(S.quiz).filter(x=>x.done).length===8)S.step=14;render();return}if(a==='quizRetry'){S.quizFeedback=null;render();return}if(a==='quizReview'){S.quizFeedback=null;S.step=11;render();return}if(a==='next')next();if(a==='back'){S.step=Math.max(0,S.step-1);render()}if(a==='mode'){S.mode=S.mode==='class'?'solo':'class';render()}if(a==='import')$('file').click();if(a==='download')nxExport();if(a==='pdf')report();if(a==='finish'){S.step=17;render()}if(a==='decision1'){if(S.decisions.first===undefined||!requireText(['first']))return;next()}if(a==='reflectPerspective'){if(!requireText(['perspective']))return;next()}if(a==='decision2'){if(S.decisions.talk===undefined||!requireText(['talk']))return;next()}if(a==='requirePrep'){if(!requireText(['batna','watna']))return;next()}if(a==='decision3'){if(S.decisions.agreement===undefined||!requireText(['agreement']))return;next()}if(a==='reflection'){if(!requireText(['reflection1','reflection2','reflection3','reflection4']))return;next()}}
$('file').addEventListener('change',e=>{if(e.target.files[0])importSave(e.target.files[0]);e.target.value=''});$('about').onclick=()=>showModal('about');$('dossier').onclick=()=>showModal('dossier');$('closeModal').onclick=()=>$('modal').close();$('lang').onclick=()=>{S.lang=S.lang==='pl'?'en':'pl';render();nxLabels()};$('smaller').onclick=()=>{S.font=Math.max(100,S.font-10);render()};$('bigger').onclick=()=>{S.font=Math.min(200,S.font+10);render()};$('reset').onclick=()=>{if(confirm(T('Rozpocząć od nowa?','Restart?'))){let old=S.parent;S=init();S.parent=old;render()}};render();nxLabels();


function nxExport(){persist();const data={...S,project:'NEXORA',episode:2,format:'nexora-progress',version:2,exportedAt:new Date().toISOString(),cumulativeHistory:[...(Array.isArray(S.parent?.cumulativeHistory)?S.parent.cumulativeHistory:(S.parent?[{episode:1,data:S.parent}]:[])),{episode:2,decisions:S.decisions,notes:S.notes,quiz:S.quiz,quizHistory:S.history}]};nxDownload(data,'nexora-odcinek-2-zapis.json')}
function nxImport(file){importSave(file);nxNotice(S.lang==='en'?'Reading save file…':'Odczytywanie zapisu…')}


function nxLabels(){const en=(typeof state!=='undefined'?state.lang:S.lang)==='en';const L=(pl,eng)=>en?eng:pl;document.getElementById('nxHome').textContent=L('⌂ Strona główna','⌂ Home');document.getElementById('nxSave').textContent=L('⇩ Zapisz postęp do pliku','⇩ Save progress to file');document.getElementById('nxLoad').textContent=L('↥ Wznów grę z pliku','↥ Resume from file');document.getElementById('nxExitTitle').textContent=L('Powrót na stronę główną','Return to home');document.getElementById('nxExitText').textContent=L('Czy chcesz zapisać postęp przed wyjściem?','Would you like to save your progress before leaving?');document.getElementById('nxSaveExit').textContent=L('Zapisz i wyjdź','Save and leave');document.getElementById('nxExitWithout').textContent=L('Wyjdź bez zapisywania','Leave without saving');document.getElementById('nxCancel').textContent=L('Anuluj','Cancel');}
function nxNotice(msg){document.getElementById('nxNotice').textContent=msg;}
function nxDownload(data,filename){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);nxNotice((typeof state!=='undefined'?state.lang:S.lang)==='en'?'Save prepared — check Downloads.':'Przygotowano zapis — sprawdź Pobrane.');}
function nxLeave(){window.location.href='../';}
document.getElementById('nxHome').addEventListener('click',()=>{nxLabels();document.getElementById('nxExit').showModal()});
document.getElementById('nxSave').addEventListener('click',()=>nxExport());
document.getElementById('nxLoad').addEventListener('click',()=>document.getElementById('nxImportFile').click());
document.getElementById('nxSaveExit').addEventListener('click',()=>{nxExport();nxLeave()});
document.getElementById('nxExitWithout').addEventListener('click',nxLeave);
document.getElementById('nxCancel').addEventListener('click',()=>document.getElementById('nxExit').close());
document.getElementById('nxImportFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)nxImport(f);e.target.value=''});

</script></body></html>
