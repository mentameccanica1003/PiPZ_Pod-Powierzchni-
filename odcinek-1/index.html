:root{font-size:calc(17px * var(--size));--bg:#080d14;--card:#131e2a;--muted:#aab7c5;--line:#344352;--red:#e32643;--text:#f6f7fa;--size:1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#27313f 0%,#080d14 58%);color:var(--text);font:1rem/1.6 system-ui,Segoe UI,sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #ffd47a;outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:16px max(20px,calc((100vw - 1080px)/2))}.logo{font-size:1.3em;font-weight:850;letter-spacing:.14em}.logo b{color:var(--red)}.controls{display:flex;align-items:center;gap:9px}.smallbtn{border:1px solid var(--line);background:#1a2634;color:white;border-radius:8px;padding:6px 11px}main{max-width:1080px;margin:32px auto 90px;padding:0 20px}.eyebrow{font-size:.76em;letter-spacing:.16em;text-transform:uppercase;color:#ff6379;font-weight:800}.stage{min-height:480px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(120deg,#111c29,#0b121b);box-shadow:0 22px 65px #0007}.scene{padding:clamp(24px,5vw,60px);position:relative}.scene:before{content:'';position:absolute;right:-10%;top:-30%;width:55%;height:100%;background:radial-gradient(#8b1e3233,transparent 68%);pointer-events:none}h1{font-size:clamp(2em,4vw + 1em,4.2em);line-height:1.1;margin:12px 0 22px}h2{font-size:1.65em;margin:12px 0}.lead{font-size:1.12em;max-width:760px;color:#e4e9ef}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{border:1px solid #6a7888;background:#1b2b3b;color:white;padding:12px 19px;border-radius:10px;font-weight:650}.btn.primary{background:var(--red);border-color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.artifact{background:#d8dce0;color:#1b2935;border-radius:5px;padding:24px;max-width:680px;box-shadow:0 15px 35px #0008;transform:rotate(-.5deg);margin:22px 0}.artifact strong{display:block;letter-spacing:.08em}.artifact .line{border-bottom:1px solid #a4aeb7;padding:9px 0}.message{background:#152537;border-left:4px solid var(--red);padding:19px;border-radius:6px;max-width:620px;margin:22px 0}.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}.profile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#182635;color:white;text-align:left;padding:0}.profile img{width:100%;height:180px;object-fit:cover;object-position:center top}.profile .info{padding:10px}.profile strong{display:block}.profile span{font-size:.9em;color:var(--muted)}.portrait{width:100px;height:115px;object-fit:cover;border-radius:8px;flex-shrink:0}.dialogue{display:flex;gap:16px;align-items:flex-start;border-bottom:1px solid #344352;padding:15px 0}.dialogue p{margin:4px 0}.dialogue strong{color:#fff}.choice{display:block;text-align:left;width:100%;margin:9px 0;padding:15px;background:#1b2b3b;border:1px solid #53677b;border-radius:10px;color:white}.choice[aria-pressed=true]{border:2px solid #ff6078;background:#3b2430}.choice strong{color:#ff8d9d;margin-right:9px}.field{width:100%;padding:14px;border:1px solid #53677b;background:#101a25;color:white;border-radius:9px;min-height:105px}.status{font-size:.85em;color:#c2d1df;margin:18px 0}.divider{height:1px;background:var(--line);margin:24px 0}.hint{background:#1a2a3b;padding:17px;border-radius:10px;border:1px solid #3e5266}.note{font-size:.82em;color:#b7c5d1}.hidden{display:none}footer{max-width:1080px;margin:0 auto;padding:0 20px 30px;color:#9cacbd;font-size:.8em}@media(max-width:600px){header{padding:12px 16px}.controls{flex-wrap:wrap}.dialogue{gap:10px}.profiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr))}.artifact{overflow-wrap:anywhere;padding:16px}.message{overflow-wrap:anywhere}.choice{overflow-wrap:anywhere}.profile img{height:140px}.portrait{width:75px;height:90px}.scene{padding:24px}.stage{min-height:400px}}@media(prefers-reduced-motion:no-preference){.scene{animation:appear .4s ease}@keyframes appear{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
dialog{width:min(920px,calc(100vw - 24px));max-height:88vh;overflow-y:auto;border:1px solid #53677b;border-radius:16px;background:#101c29;color:white;padding:clamp(16px,3vw,32px)}dialog::backdrop{background:#000b}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:-1px;background:#101c29;padding:5px 0 12px;z-index:1}.dossiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.personcard{border:1px solid #40536a;border-radius:12px;overflow:hidden;background:#172636}.personcard img{width:100%;height:190px;object-fit:cover;object-position:top}.personcard .details{padding:15px}.personcard p{font-size:.9em}.abouttext{max-width:75ch;line-height:1.75}.abouttext p{margin:0 0 1em}.abouttext h3{margin-top:1.5em}.controls{flex-wrap:wrap}@media print{header,footer,.status,.actions{display:none!important}body{background:white;color:black}.stage{border:none;box-shadow:none}} </style></head><body><header><div class="logo">NE<b>X</b>ORA <span style="font-size:.6em;font-weight:400;letter-spacing:0">/ POD POWIERZCHNIĄ</span></div><div class="controls"><button class="smallbtn" id="about">O NEXORZE</button><button class="smallbtn" id="dossier">Akta postaci</button><button class="smallbtn" id="lang">EN</button><button class="smallbtn" id="smaller" aria-label="Zmniejsz tekst">A−</button><button class="smallbtn" id="bigger" aria-label="Powiększ tekst">A+</button><span id="fontval" aria-live="polite" style="min-width:3.5em;text-align:center">100%</span><button class="smallbtn" id="reset">↺</button></div></header><main><div class="eyebrow" id="episode"></div><section class="stage" id="stage" aria-live="polite"></section><div class="status" id="status"></div></main><footer id="foot"></footer><dialog id="dossierDialog" aria-labelledby="dossierTitle"><div class="modalhead"><h2 id="dossierTitle">Akta postaci</h2><button class="smallbtn" id="closeDossier" aria-label="Zamknij">✕</button></div><div id="dossierBody"></div></dialog><dialog id="aboutDialog" aria-labelledby="aboutTitle"><div class="modalhead"><h2 id="aboutTitle">NEXORA — kontekst organizacji</h2><button class="smallbtn" id="closeAbout" aria-label="Zamknij">✕</button></div><div id="aboutBody"></div></dialog><script>
const T=(pl,en)=>state.lang==='pl'?pl:en;
const people={marta:{pl:['Marta','Starsza specjalistka','Od dwunastu lat pracuje w NEXORZE i pamięta kilka wcześniejszych etapów wdrożenia, w tym decyzje podjęte jeszcze przed odejściem Adama. Odpowiada za jakość i uważa, że część testów nie została wystarczająco wyjaśniona, zanim pojawiła się presja na zamknięcie prac. Podczas spotkań potrafi otwarcie kwestionować ustalenia, co jedni odbierają jako odpowiedzialność, a inni jako utrudnianie postępu.'],en:['Marta','Senior specialist','Marta has worked at NEXORA for twelve years and remembers earlier phases of the implementation, including decisions made before Adam left. Responsible for quality, she believes some tests were not sufficiently clarified before pressure mounted to close the work. She challenges decisions openly in meetings, which some interpret as responsibility and others as resistance to progress.']},tomasz:{pl:['Tomasz','Koordynator wdrożenia','Od pięciu lat koordynuje wdrożenia i odpowiada za planowanie zadań, zależności między zespołami oraz dotrzymywanie terminów. W ostatnich tygodniach kilkakrotnie musiał tłumaczyć opóźnienia, dlatego obawia się kolejnej rundy analiz bez konkretnych ustaleń. Zależy mu na sprawnym działaniu, ale nie wiadomo jeszcze, jak rozumie ryzyko związane z jakością.'],en:['Tomasz','Implementation coordinator','Tomasz has coordinated implementations for five years, managing tasks, dependencies and deadlines. In recent weeks he has repeatedly had to explain delays, so he worries about another round of analysis without concrete decisions. He values action and momentum, although it is not yet clear how he assesses quality-related risks.']},julia:{pl:['Julia','Analityczka danych','Od trzech lat pracuje jako analityczka danych i przygotowuje zestawienia, na których opierają się decyzje wdrożeniowe. Podczas porównywania plików zauważyła różnice między wersjami dokumentacji, ale nie jest pewna, czy wynikają one z błędu, aktualizacji czy odmiennego sposobu raportowania. Na spotkaniach mówi ostrożnie, a kiedy próbuje przedstawić szczegóły, nie zawsze udaje jej się dojść do głosu.'],en:['Julia','Data analyst','Julia has worked as a data analyst for three years and prepares reports used in implementation decisions. While comparing files, she noticed differences between document versions, but cannot yet tell whether they reflect an error, an update or a different reporting method. She speaks cautiously in meetings and does not always get the opportunity to explain her findings.']},robert:{pl:['Robert','Dyrektor operacyjny','Jako dyrektor operacyjny odpowiada za realizację kontraktu, relację z klientem i zobowiązania dotyczące terminu wdrożenia. Po odejściu Adama oczekuje od nowego kierownika szybkiego uporządkowania sytuacji, ponieważ kolejne przesunięcie harmonogramu może mieć konsekwencje biznesowe. Naciska na decyzje i konkretne działania, ale nie wiadomo jeszcze, jaką wiedzą dysponuje na temat rozbieżności w raportach.'],en:['Robert','Operations director','As operations director, Robert is responsible for the contract, client relationship and delivery commitments. After Adam left, he expects the new manager to restore order quickly because another schedule slip may have business consequences. He pushes for decisions and concrete action, but it is not yet clear what he knows about discrepancies in the reports.']},adam:{pl:['Adam Wysocki','Poprzedni kierownik','Przez sześć lat pracował w NEXORZE, ostatnio jako kierownik zespołu odpowiedzialnego za bieżące wdrożenie. Odszedł trzy tygodnie przed Twoim przyjściem, pozostawiając dokumentację, której status nie dla wszystkich jest jednoznaczny. Oficjalne informacje o jego odejściu są lakoniczne, a członkowie zespołu reagują na jego nazwisko w różny sposób.'],en:['Adam Wysocki','Former team manager','Adam worked at NEXORA for six years, most recently leading the team responsible for the current implementation. He left three weeks before your arrival, leaving documentation whose status is not clear to everyone. The official explanation of his departure is brief, and team members react differently when his name is mentioned.']}};
let state={step:0,lang:'pl',font:100,mode:'class',choice:null,reason:'',reflection:'',seen:[],quiz:{},quizAttempts:{},quizHistory:{},trustChoice:null,trustWhy:'',trustAction:null,trustPlan:'',finalReflection:'',trustReflection:'',trustWeek:'',revisit:''};

const $=id=>document.getElementById(id),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]));
function save(){try{localStorage.setItem('nexora_episode1_trust_v4',JSON.stringify(state))}catch(e){}}
function button(label,fn,primary=false){return `<button class="btn ${primary?'primary':''}" data-act="${fn}">${label}</button>`}
function next(){state.step=Math.min(19,state.step+1);save();render()}
function portrait(k){return `<img class="portrait" src="assets/${k}.webp" alt="${safe(people[k][state.lang][0])}">`}
function profile(k){let p=people[k][state.lang];return `<button class="profile" data-person="${k}"><img src="assets/${k}.webp" alt=""><div class="info"><strong>${p[0]}</strong><span>${p[1]}</span></div></button>`}
function aboutText(){return `<div class="abouttext">${T(`<p><strong>NEXORA</strong> jest fikcyjną firmą technologiczną, która projektuje i wdraża systemy wspierające zarządzanie operacjami w dużych organizacjach. Jej rozwiązania łączą dane z różnych działów klienta, porządkują obieg informacji i pomagają śledzić realizację procesów. Sam produkt jest tylko częścią usługi: każde wdrożenie wymaga dopasowania systemu do sposobu pracy klienta, migracji danych, testów, szkoleń oraz uzgodnienia, kto i na jakiej podstawie podejmuje decyzję o uruchomieniu.</p><p>Obecnie NEXORA realizuje ważny kontrakt dla klienta prowadzącego rozbudowaną działalność operacyjną. Zespół przygotowuje uruchomienie modułu, który ma łączyć raportowanie postępu z informacjami o jakości realizowanych zadań. Termin został już zakomunikowany klientowi. Jego przesunięcie oznaczałoby dodatkowe koszty, konieczność zmiany harmonogramów po obu stronach i trudne rozmowy o wiarygodności NEXORY. Jednocześnie przed uruchomieniem trzeba upewnić się, że wyniki testów są właściwie opisane i że zgłoszone zastrzeżenia nie zostały pominięte.</p><p>Na pierwszy rzut oka jest to typowy problem zarządzania projektem: termin, zakres, jakość i odpowiedzialność. W rzeczywistości coraz większe znaczenie ma sposób współpracy ludzi. Nie wszyscy jednakowo rozumieją, co oznacza „gotowość do wdrożenia”. Dla jednych kluczowe jest dotrzymanie zobowiązań wobec klienta. Inni obawiają się, że zbyt szybkie zamknięcie sprawy sprawi, iż nierozwiązane problemy ujawnią się dopiero po uruchomieniu. Obie perspektywy mogą wynikać z troski o organizację, ale rozmowy coraz częściej przybierają formę wzajemnych pretensji.</p><p>W centrum tych napięć znajduje się niewielki zespół. Robert, dyrektor operacyjny, odpowiada za kontrakt i oczekuje konkretnych decyzji. Tomasz koordynuje harmonogram i zależności między zadaniami. Marta, doświadczona specjalistka, zwraca uwagę na jakość oraz sposób dokumentowania zastrzeżeń. Julia analizuje dane i porównuje kolejne wersje raportów. Każda z tych osób widzi tylko część sytuacji, dysponuje innymi informacjami i ponosi inną odpowiedzialność.</p><p>Jeszcze trzy tygodnie temu zespołem kierował Adam Wysocki. Odszedł nagle. Oficjalne wyjaśnienia są skąpe, a pracownicy niechętnie mówią o ostatnich tygodniach jego pracy. W dokumentacji pojawiają się dwie wersje raportu wdrożenia z tą samą datą, ale nieidentycznym opisem stanu testów. Sama różnica nie dowodzi nadużycia: mogła wynikać z aktualizacji, sposobu raportowania albo błędu. Nie wiadomo jednak, kto i kiedy zatwierdził zmiany.</p><p><strong>Ty jesteś nowo mianowanym kierownikiem zespołu wdrożeniowego.</strong> Nie odgrywasz Roberta ani Adama; jesteś osobną postacią, której decyzje kształtujesz samodzielnie. Twoim zadaniem jest uporządkowanie współpracy, rozpoznanie stanu prac, zapewnienie rzetelnego przepływu informacji i przygotowanie podstaw do odpowiedzialnej decyzji o dalszych krokach. Nie masz jeszcze wystarczających danych, by rozstrzygnąć, czy wdrożenie powinno zostać zatwierdzone. Nie znasz też pełnej historii konfliktów.</p><p>Twoim pierwszym sprawdzianem nie będzie więc znalezienie winnego. Będzie nim sposób, w jaki potraktujesz ludzi, ich obawy i sprzeczne informacje. Czy potrafisz wysłuchać zastrzeżeń bez składania pustych obietnic? Czy przyznasz, czego jeszcze nie wiesz? Czy dotrzymasz tego, co zapowiesz? W tym odcinku poznasz zaufanie jako praktykę codziennego przywództwa: coś, co może rosnąć dzięki konsekwentnym zachowaniom albo słabnąć, gdy ludzie przestają wierzyć, że warto mówić otwarcie.</p><h3>Twoja misja</h3><p>Poprowadź pierwsze spotkanie, poznaj perspektywy zespołu, podejmij decyzje w dwóch trudnych rozmowach, a następnie oceń swoje działania z wykorzystaniem koncepcji Patricka Lencioniego i Bruce’a Tuckmana. Zapisz refleksję dotyczącą tego, jak budować zaufanie w pierwszym tygodniu pracy. To symulacja: nie musisz zgadywać jedynej „poprawnej” decyzji, lecz uzasadnić wybór, rozważyć jego konsekwencje i wyciągnąć wnioski.</p>`,`<p><strong>NEXORA</strong> is a fictional technology company designing and implementing operational management systems for large organizations. Its solutions connect information from different departments, organize workflows and support process reporting. Each implementation also requires configuration, data migration, testing, training and agreement about who can authorize a launch.</p><p>NEXORA is now delivering an important project for a client with complex operations. The new module combines progress reporting with quality-related information. A launch date has already been promised. A delay would bring extra costs and difficult conversations, yet unresolved tests must be accurately reported before the system goes live.</p><p>The problem is not only technical. Team members understand readiness differently. Some focus on meeting commitments; others worry that unresolved issues will surface after launch. Both concerns can be legitimate. Robert, the operations director, is responsible for the client relationship. Tomasz coordinates the schedule. Marta, a senior specialist, focuses on quality and the treatment of objections. Julia analyzes data and compares report versions.</p><p>Three weeks ago the previous manager, Adam Wysocki, left abruptly. Explanations are limited. Two reports bearing the same date describe test status differently. This discrepancy alone proves nothing: it might reflect an update, a reporting convention or a mistake. Yet the team has not clarified what happened.</p><p><strong>You are the newly appointed implementation team manager.</strong> You are not Robert or Adam; you play a separate character and shape their decisions. Your task is to restore collaboration, establish what is known, and prepare the ground for responsible next steps. You do not yet have enough evidence to approve the launch or assign blame.</p><p>Your first test is how you respond to people, concerns and conflicting information. Will you listen without making empty promises? Admit what you do not know? Follow through on commitments? In this episode, trust is a leadership practice built—or damaged—through observable actions.</p><h3>Your mission</h3><p>Lead the first meeting, explore the team's perspectives, make decisions in two difficult conversations, then reassess your actions using Patrick Lencioni's and Bruce Tuckman's models. Write a reflection on building trust during your first week. There is no single magic answer: justify your decisions and examine their consequences.</p>`)}</div>`}
function showDossier(){let keys=['player','robert','marta','tomasz','julia','adam'];let player=state.lang==='pl'?['TY — NOWY KIEROWNIK','Postać gracza','Obejmujesz odpowiedzialność za zespół wdrożeniowy po nagłym odejściu Adama. Nie znasz jeszcze całej historii projektu ani relacji między pracownikami. Twoje decyzje, rozmowy i zobowiązania określą, jak rozpoczniesz budowanie zaufania.']:['YOU — NEW MANAGER','Player character','You take responsibility for the implementation team after Adam’s abrupt departure. You do not yet know the full project history or the relationships within the team. Your choices, conversations and commitments shape how you begin building trust.'];$('dossierBody').innerHTML=`<p class="muted">${T('Informacje bez spoilerów. Przewiń, aby zobaczyć wszystkie postacie.','Spoiler-free profiles. Scroll to see every character.')}</p><div class="dossiergrid">`+keys.map(k=>{let p=k==='player'?player:people[k][state.lang];return `<article class="personcard">${k==='player'?`<div style="height:190px;display:grid;place-items:center;background:linear-gradient(130deg,#1c3648,#3b2337);font-size:5em" aria-hidden="true">?</div>`:`<img src="assets/${k}.webp" alt="">`}<div class="details"><strong>${safe(p[0])}</strong><div class="muted">${safe(p[1])}</div><p>${safe(p[2])}</p></div></article>`}).join('')+'</div>';$('dossierDialog').showModal()}
function scene(){let s=state.step;
if(s===0)return `<div class="scene"><div class="eyebrow">${T('AKTA SPRAWY · WPROWADZENIE DO STUDIUM PRZYPADKU','CASE FILE · INTRODUCTION')}</div><h1>${T('Witaj w NEXORZE','Welcome to NEXORA')}</h1><p class="lead">${T('Zanim wejdziesz do sali B-204, poznaj organizację, projekt i swoją rolę.','Before entering room B-204, learn about the organization, the project and your role.')}</p>${aboutText()}<div class="actions">${button(T('Rozpocznij prolog: trzy tygodnie wcześniej','Begin prologue: three weeks earlier'),'next',true)}</div></div>`;
if(s===1)return `<div class="scene"><div class="eyebrow">${T('TRZY TYGODNIE WCZEŚNIEJ · PIĄTEK · 19:46','THREE WEEKS EARLIER · FRIDAY · 19:46')}</div><h1>${T('Puste piętro','The empty floor')}</h1><div class="row">${portrait('adam')}<p class="lead">${T('Budynek NEXORY jest prawie pusty. Adam Wysocki siedzi sam przy biurku. Na monitorze ma otwarte dwa dokumenty. Oba noszą tę samą datę.','The NEXORA building is almost empty. Adam Wysocki sits alone at his desk. Two documents are open on his monitor. Both carry the same date.')}</p></div><div class="actions">${button(T('Przyjrzyj się dokumentom','Inspect the documents'),'next',true)}</div></div>`;
if(s===2)return `<div class="scene"><div class="eyebrow">NEXORA · ${T('DOKUMENT WEWNĘTRZNY','INTERNAL DOCUMENT')}</div><h2>${T('Dwie wersje raportu','Two versions of the report')}</h2><div class="artifact"><strong>${T('RAPORT WDROŻENIA','IMPLEMENTATION REPORT')}</strong><div class="line">${T('WERSJA ROBOCZA','DRAFT VERSION')} <span style="float:right">18.09</span></div><div class="line">${T('Status testów: część nierozstrzygnięta','Test status: some items unresolved')}</div><div class="line" style="border-top:2px solid #87929e;margin-top:12px">${T('WERSJA PRZEKAZANA','SUBMITTED VERSION')} <span style="float:right">18.09</span></div><div class="line">${T('Status testów: potwierdzenie przekazania','Test status: submission confirmed')}</div></div><p>${T('Dokumenty różnią się, ale nie wiadomo jeszcze, dlaczego.','The documents differ, but the reason is not yet known.')}</p><div class="actions">${button(T('Dalej','Continue'),'next',true)}</div></div>`;
if(s===3)return `<div class="scene"><div class="eyebrow">${T('PIĄTEK · 19:47','FRIDAY · 19:47')}</div><h2>${T('Nowa wiadomość','New message')}</h2><div class="message"><div class="muted">${T('Nadawca: nieujawniony','Sender: undisclosed')} · 19:47</div><p>${T('Potrzebujemy zamknięcia tematu przed poniedziałkiem. Klient oczekuje potwierdzenia.','We need this closed before Monday. The client expects confirmation.')}</p></div><p>${T('Adam zaczyna pisać odpowiedź. Kasuje ją. Drukarka w sąsiednim pokoju uruchamia się na chwilę.','Adam begins a reply, then deletes it. A printer starts briefly in the next room.')}</p><div class="artifact" style="font-style:italic;font-size:1.3em">${T('Nie wszystko, co zatwierdzone, zostało uzgodnione.','Not everything approved was actually agreed.')}</div><div class="actions">${button(T('Zgaś światło','Fade to black'),'next',true)}</div></div>`;
if(s===4)return `<div class="scene"><div class="eyebrow">${T('TRZY TYGODNIE PÓŹNIEJ · 08:42','THREE WEEKS LATER · 08:42')}</div><h1>${T('Twój pierwszy dzień','Your first day')}</h1><p class="lead">${T('Obejmujesz kierownictwo zespołu wdrożeniowego. Oficjalnie masz uporządkować współpracę i dotrzymać terminu. Wiesz jedynie, że poprzedni kierownik odszedł nagle.','You take over an implementation team. Officially, your job is to organize collaboration and meet the deadline. All you know is that the previous manager left abruptly.')}</p><div class="hint"><strong>${T('Twoje zadanie na dziś','Your task today')}</strong><p>${T('Zespół przygotowuje wdrożenie rozwiązania dla klienta. Harmonogram wymaga potwierdzenia, ale nie wszystkie testy zostały jednoznacznie rozliczone. Robert oczekuje od Ciebie decyzji, jak poprowadzić dzisiejsze spotkanie i co zrobić dalej — nie masz jeszcze obowiązku zatwierdzać samego wdrożenia.','The team is preparing a client implementation. The schedule needs confirmation, but not all tests have been conclusively accounted for. Robert expects you to decide how to lead today’s meeting and what should happen next — you are not yet being asked to approve the implementation itself.')}</p></div><div class="message"><strong>${T('ZAPROSZENIE · SALA B-204','INVITATION · ROOM B-204')}</strong><p>09:00 · Robert, Marta, Tomasz, Julia</p><span class="muted">${T('Temat: Status wdrożenia i dalsze decyzje','Subject: Implementation status and next decisions')}</span></div><div class="actions">${button(T('Otwórz akta zespołu','Open team files'),'next',true)}</div></div>`;

if(s===6)return `<div class="scene"><div class="eyebrow">${T('PONIEDZIAŁEK · 09:00 · SALA B-204','MONDAY · 09:00 · ROOM B-204')}</div><h2>${T('Pierwsze spotkanie','The first meeting')}</h2><div class="hint"><strong>${T('Stawka spotkania','What is at stake')}</strong><p>${T('Robert chce dziś uzgodnić harmonogram dalszych prac dla klienta. Marta twierdzi, że część testów pozostaje niedokończona; Tomasz obawia się kolejnych opóźnień; Julia ma dane, których nikt jeszcze wspólnie nie omówił. Jesteś nowym kierownikiem: masz zdecydować, jak zorganizować rozmowę, aby zespół mógł działać odpowiedzialnie.','Robert wants to agree on the next steps and schedule for the client today. Marta says some tests remain unfinished; Tomasz fears more delays; Julia has data that the group has not yet reviewed together. As the new manager, you must decide how to organize the discussion so the team can act responsibly.')}</p></div>${[['robert',T('Nie mamy czasu na długie wprowadzenia. Klient oczekuje konkretów. Musimy dzisiaj ustalić harmonogram.','We have no time for lengthy introductions. The client expects specifics. We need to agree on the schedule today.')],['marta',T('Zanim go zatwierdzimy, chciałabym wiedzieć, co z testami, których nie zakończyliśmy.','Before we approve it, I want to know what happened to the tests we did not complete.')],['tomasz',T('Nie możemy wciąż wracać do tych samych kwestii. Zespół potrzebuje decyzji.','We cannot keep revisiting the same issues. The team needs a decision.')],['julia',T('Mam zestawienie, które może…','I have a summary that might…')],['robert',T('Za chwilę, Julio. Najpierw ustalmy priorytety.','In a moment, Julia. Let us set priorities first.')]].map(([k,q])=>`<div class="dialogue">${portrait(k)}<div><strong>${people[k][state.lang][0]}</strong><p>${q}</p></div></div>`).join('')}<p class="lead">${T('Zapada cisza. Wszyscy patrzą na Ciebie.','Silence falls. Everyone looks at you.')}</p><div class="actions">${button(T('Podejmij decyzję','Make a deci if(s===7){let labels=[T('Najpierw harmonogram','Schedule first'),T('Otwarta dyskusja','Open discussion'),T('Każdy przedstawia swoją perspektywę','Everyone shares their perspective'),T('Najpierw rozmowy indywidualne','Individual conversations first')];return `<div class="scene"><div class="eyebrow">${T('PUNKT DECYZYJNY · TWÓJ WYBÓR','DECISION POINT · YOUR CHOICE')}</div><h2>${T('Jak poprowadzisz spotkanie?','How will you lead the meeting?')}</h2><p>${T('Wybierz działanie i zapisz uzasadnienie, zanim poznasz argumenty innych. Nie ma tu jednej automatycznie „dobrej” decyzji.','Choose an action and write your rationale before seeing other arguments. There is no single automatically “correct” decision.')}</p><div class="hint"><strong>${T('Co dokładnie wybierasz?','What exactly are you choosing?')}</strong><p>${T('Nie decydujesz jeszcze, czy raport jest prawidłowy ani czy wdrożenie można zatwierdzić. Wybierasz pierwszy krok jako kierownik: sposób poprowadzenia rozmowy wobec sprzecznych sygnałów, presji czasu i niepełnych informacji.','You are not yet deciding whether the report is accurate or whether the implementation can be approved. You are choosing your first step as a manager: how to lead a conversation amid conflicting signals, time pressure and incomplete information.')}</p></div>${labels.map((x,i)=>`<button class="choice" data-choice="${i}" aria-pressed="${state.choice===i}"><strong>${'ABCD'[i]}</strong>${x}</button>`).join('')}<label for="reason"><strong>${T('Dlaczego wybierasz to działanie?','Why are you choosing this action?')}</strong></label><textarea class="field" id="reason" placeholder="${T('Odwołaj się do obserwacji, ryzyka i tego, czego jeszcze nie wiesz.','Refer to observations, risks, and what you still do not know.')}">${safe(state.reason)}</textarea><div class="actions">${button(T('Zapisz decyzję i przejdź dalej','Save decision and continue'),'decide',true)}</div></div>`}
if(s===8)return `<div class="scene"><div class="eyebrow">${T('KONFRONTACJA PERSPEKTYW','PERSPECTIVE CHALLENGE')}</div><h2>${T('Zanim poznasz konsekwencje…','Before you see the consequences…')}</h2><p>${T('Twoja decyzja została zapisana. Wybierz sposób konfrontacji argumentów.','Your decision is saved. Choose how to compare arguments.')}</p><div class="actions"><button class="btn ${state.mode==='class'?'primary':''}" data-mode="class">${T('Na zajęciach — dyskusja','In class — discussion')}</button><button class="btn ${state.mode==='home'?'primary':''}" data-mode="home">${T('W domu — eksperci','At home — experts')}</button></div><div class="divider"></div>${state.mode==='class'?`<div class="hint"><h2>${T('Zatrzymaj historię','Pause the story')}</h2><p>${T('Pokaż grupie swój wybór:','Show your choice to the group:')}</p><h1 style="color:#ff627b;font-size:5rem">${'ABCD'[state.choice??0]}</h1><p>${T('Porównajcie argumenty: jakie przyjęliście założenia, co jest faktem, a co interpretacją? Czy po rozmowie zmieniło się Twoje rozumienie sytuacji?','Compare arguments: which assumptions did you make, what is fact and what is interpretation? Has your understanding changed?')}</p></div>`:`<div class="hint"><h2>${T('Trzy głosy','Three voices')}</h2>${[['anna',T('Anna · psycholożka organizacji','Anna · organizational psychologist'),T('Milczenie nie musi oznaczać zgody. Ale czy na podstawie jednego spotkania wiemy, dlaczego Julia nie mówi?','Silence does not necessarily mean agreement. But can we know why Julia is quiet from one meeting?')],['marek',T('Marek · dyrektor operacyjny','Marek · operations director'),T('Odroczenie decyzji także ma koszt. Jak ochronisz termin, nie ignorując ryzyka?','Delaying a decision also has a cost. How can you protect the deadline without ignoring risk?')],['karolina',T('Karolina · kierowniczka projektów','Karolina · project manager'),T('Każdy widzi inny fragment problemu. Które informacje trzeba najpierw zweryfikować?','Everyone sees a different part of the problem. What information should be verified first?')]].map(([k,name,q])=>`<div class="dialogue"><img class="portrait" src="assets/${k}.webp" alt=""><div><strong>${name}</strong><p>${q}</p></div></div>`).join('')}</div>`}<p><label for="reflection"><strong>${T('Co zmieniło się w Twojej interpretacji — lub dlaczego podtrzymujesz stanowisko?','What changed in your interpretation — or why do you maintain your position?')}</strong></label></p><textarea id="reflection" class="field">${safe(state.reflection)}</textarea><div class="actions">${button(T('Odkryj konsekwencje','Reveal consequences'),'reflect',true)}</div></div>`;
if(s===9){let outcome=[T('Robert przyjmuje harmonogram, ale Marta wycofuje się z potwierdzenia danych. Napięcie pozostaje nierozwiązane.','Robert accepts the schedule, but Marta withdraws from confirming the data. The tension remains unresolved.'),T('Marta ujawnia niedokończone testy. Julia pokazuje różnicę między wersją roboczą i przekazaną. Robert oczekuje decyzji.','Marta reveals unfinished tests. Julia shows the difference between draft and submitted versions. Robert still expects a decision.'),T('Julia pokazuje dokument „Rozbieżności — wersja 3”. Dowiadujesz się, że Adam zachował kopię. Presja rośnie.','Julia shows a document titled “Discrepancies — version 3”. You learn that Adam kept a copy. Pressure increases.'),T('Ustalasz pilne działania i osobne rozmowy. Robert jest niecierpliwy, lecz Marta i Julia zgadzają się przekazać materiały.','You agree on urgent tasks and separate conversations. Robert is impatient, but Marta and Julia agree to share materials.')][state.choice??0];return `<div class="scene"><div class="eyebrow">${T('KONSEKWENCJE · SALA B-204','CONSEQUENCES · ROOM B-204')}</div><h2>${T('Decyzje mają swoją cenę','Every decision has a cost')}</h2><div class="message"><strong>${T('Wybrano','Selected')}: ${'ABCD'[state.choice??0]}</strong><p>${outcome}</p></div><p>${T('To tylko część historii. Nie możesz jeszcze wiedzieć, które interpretacje okażą się trafne.','This is only part of the story. You cannot yet know which interpretations will prove accurate.')}</p><div class="actions">${button(T('Zobacz podsumowanie','View summary'),'next',true)}</div></div>`}
if(s===10)return `<div class="scene"><div class="eyebrow">${T('09:38 · GABINET KIEROWNIKA','09:38 · MANAGER’S OFFICE')}</div><h2>${T('To nie było zwykłe spotkanie','This was no ordinary meeting')}</h2><p class="lead">${T('Na korytarzu Marta zatrzymuje się przy drzwiach. „Nie chodzi o to, żeby wstrzymywać wszystko” — mówi ciszej. „Chodzi o to, żeby nikt później nie powiedział, że ostrzeżeń nie było”. Nie czeka na odpowiedź.','In the corridor, Marta pauses by the door. “I am not trying to stop everything,” she says quietly. “I just do not want anyone to say later that there were no warnings.” She leaves before you can reply.')}</p><div class="dialogue">${portrait('tomasz')}<div><strong>Tomasz</strong><p>${T('„Marta ma rację w kwestii testów. Ale nie mówi, co się stanie, jeśli stracimy kolejny tydzień. Adam też próbował pogodzić jedno z drugim”.','“Marta is right about the tests. But she does not say what happens if we lose another week. Adam tried to reconcile both sides, too.”')}</p></div></div><p>${T('Na biurku czeka wiadomość od HR: „Zanim zaproponujesz zmiany, spróbuj rozpoznać mechanizmy współpracy. Nie diagnozuj ludzi na podstawie jednego spotkania”.','An HR note awaits: “Before proposing changes, try to understand the team dynamics. Do not diagnose people based on one meeting.”')}</p><div class="actions">${button(T('Otwórz misję analityczną','Open analysis mission'),'next',true)}</div></div>`;
if(s===11)return `<div class="scene"><div class="eyebrow">${T('MISJA ANALITYCZNA · MATERIAŁ 1','ANALYSIS MISSION · RESOURCE 1')}</div><h2>${T('Pięć dysfunkcji zespołu','Five dysfunctions of a team')}</h2><p>${T('Model Patricka Lencioniego opisuje pięć powiązanych dysfunkcji. Zaufanie oparte na gotowości przyznania się do błędu i niewiedzy tworzy warunki do otwartego, konstruktywnego konfliktu. Brak takiego konfliktu może utrudniać autentyczne zaangażowanie w decyzje. To z kolei może osłabiać wzajemną odpowiedzialność i koncentrację na wspólnych wynikach.','Patrick Lencioni’s model describes five linked dysfunctions. Vulnerability-based trust supports open, constructive conflict. Without such conflict, genuine commitment can be harder to achieve, undermining accountability and attention to collective results.')}</p><div class="artifact"><strong>${T('PIĘĆ DYSFUNKCJI — OD PODSTAWY','FIVE DYSFUNCTIONS — FROM THE BASE')}</strong><div class="line">1. ${T('Brak zaufania','Absence of trust')}</div><div class="line">2. ${T('Obawa przed konfliktem','Fear of conflict')}</div><div class="line">3. ${T('Brak zaangażowania w decyzje','Lack of commitment')}</div><div class="line">4. ${T('Unikanie odpowiedzialności','Avoidance of accountability')}</div><div class="line">5. ${T('Brak dbałości o wyniki zespołu','Inattention to team results')}</div></div><p class="hint">${T('W NEXORZE: cisza Julii może być sygnałem, ale nie jest jeszcze dowodem braku zaufania. Marta może kwestionować decyzję, a jednocześnie działać na rzecz zespołu.','At NEXORA, Julia’s silence may be a signal, not proof of low trust. Marta may challenge a decision while acting in the team’s interest.')}</p><p class="note">Lencioni, P. (2002). <i>The Five Dysfunctions of a Team</i>. Jossey-Bass. ${T('Model praktyczny, nie narzędzie diagnostyczne.','A practitioner model, not a diagnostic instrument.')}</p><div class="actions">${button(T('Następny materiał','Next resource'),'next',true)}</div></div>`;
if(s===12)return `<div class="scene"><div class="eyebrow">${T('MISJA ANALITYCZNA · MATERIAŁ 2','ANALYSIS MISSION · RESOURCE 2')}</div><h2>${T('Etapy rozwoju zespołu','Stages of team development')}</h2><p>${T('Bruce Tuckman zaproponował opis procesów grupowych: forming (orientacja), storming (napięcia i negocjowanie wpływu), norming (uzgadnianie norm), performing (skuteczna współpraca). Wraz z Mary Ann Jensen dodał później adjourning (zakończenie pracy grupy).','Bruce Tuckman described group processes: forming (orientation), storming (tension and negotiation of influence), norming (establishing norms), and performing (effective collaboration). With Mary Ann Jensen, he later added adjourning (group dissolution).')}</p><div class="hint"><strong>${T('Uwaga analityczna','Analytical caution')}</strong><p>${T('Etapy nie są sztywną diagnozą. Zespół może wracać do wcześniejszych napięć, zwłaszcza po zmianie kierownika. Jedno spotkanie nie wystarcza, aby pewnie określić etap.','The stages are not a rigid diagnosis. Teams may revisit earlier tensions, especially after a leadership change. One meeting cannot establish a stage with certainty.')}</p></div><p class="note">Tuckman, B. W. (1965). Developmental sequence in small groups. <i>Psychological Bulletin</i>, 63(6), 384–399. Tuckman, B. W., & Jensen, M. A. C. (1977). Stages of small-group development revisited. <i>Group & Organization Studies</i>, 2(4), 419–427.</p><div class="actions">${button(T('Przejdź do analizy obserwacji','Analyze observations'),'next',true)}</div></div>`;
if(s===13)return `<div class="scene"><div class="eyebrow">${T('AKTA B-204 · ANALIZA','ROOM B-204 · ANALYSIS')}</div><h2>${T('Co wiesz, a co tylko przypuszczasz?','What do you know, and what are you assuming?')}</h2>${[['julia',T('Julia nie dokończyła wypowiedzi.','Julia did not finish speaking.'),T('Może obawiać się reakcji, ale mogła też nie mieć gotowych danych.','She might fear reactions, but she might also lack finalized data.')],['marta',T('Marta zakwestionowała harmonogram.','Marta challenged the schedule.'),T('To może być konstruktywny spór o ryzyko, nie „trudny charakter”.','This could be constructive disagreement about risk, not a “difficult personality”.')],['tomasz',T('Tomasz domagał się decyzji.','Tomasz demanded a decision.'),T('Może chronić zobowiązania wobec klienta, niekoniecznie ignorować jakość.','He may be protecting client commitments, not necessarily ignoring quality.')],['robert',T('Robert przerwał Julii.','Robert interrupted Julia.'),T('Zachowanie jest obserwowalne; intencja pozostaje hipotezą.','The behavior is observable; the intention remains a hypothesis.')]].map(([k,a,b])=>`<div class="dialogue">${portrait(k)}<div><strong>${a}</strong><p class="muted">${b}</p></div></div>`).join('')}<p class="hint">${T('Twoja misja: nie wybierać winnego, tylko zdecydować, jakich informacji potrzebujesz, aby kierować odpowiedzialnie.','Your mission: do not choose a culprit; determine what information you need to lead responsibly.')}</p><div class="actions">${button(T('Sprawdź rozumienie teorii','Check theory knowledge'),'next',true)}</div></div>`;
if(s===14){let q=questions();let correct=Object.values(state.quiz||{}).filter(v=>v===true).length;let pending=q.find((_,i)=>state.quiz?.[i]!==true);if(!pending)return `<div class="scene"><div class="eyebrow">${T('TEST ZALICZONY · 8/8 OBSZARÓW','KNOWLEDGE GATE PASSED · 8/8 AREAS')}</div><h2>${T('Wiedza to dopiero początek','Knowledge is only the beginning')}</h2><p>${T('Wykazałeś rozumienie ośmiu zagadnień. Teraz sprawdź, jak Twoje działania mogą budować zaufanie.','You have demonstrated understanding of eight areas. Now explore how your actions can build trust.')}</p><div class="actions">${button(T('Przejdź do rozmowy z Martą','Talk with Marta'),'next',true)}</div></div>`;let i=q.indexOf(pending),attempt=state.quizAttempts?.[i]||0,options=attempt===0?q[i].main:attempt===1?q[i].alt:thirdQuestions()[i],shift=(i*3+1+attempt)%4;return `<div class="scene"><div class="eyebrow">${T('BRAMKA WIEDZY','KNOWLEDGE GATE')} · ${correct}/8</div><h2>${T('Pytanie','Question')} ${i+1}/8</h2><p class="lead">${options[0]}</p>${[0,1,2,3].map(j=>`<button class="choice" data-answer="${(j+shift)%4}" data-q="${i}"><strong>${'ABCD'[j]}</strong>${options[1+(j+shift)%4]}</button>`).join('')}<p class="note">${T('Każda błędna odpowiedź uruchamia wyjaśnienie i NOWE pytanie. Po trzech błędach wrócisz do materiału, a następnie rozpoczniesz ten obszar od nowa.','Each incorrect answer triggers an explanation and a NEW question. After three errors, review the material and restart this topic.')}</p><div id="feedback" role="status"></div></div>`}
if(s===15)return `<div class="scene"><div class="eyebrow">${T('11:20 · GABINET KIEROWNIKA · BUDOWANIE ZAUFANIA','11:20 · MANAGER’S OFFICE · BUILDING TRUST')}</div><h2>${T('„Czy potraktuje Pan to poważnie?”','“Will you take this seriously?”')}</h2><div class="dialogue">${portrait('marta')}<div><strong>Marta</strong><p>${T('„Nie wiem, co Robert powiedział Panu o Adamie. Poprzednio zgłaszałam zastrzeżenia do testów, a potem wyglądało, jakbym wszystko zaakceptowała. Nie proszę, żeby stanął Pan po mojej stronie. Chcę wiedzieć, czy moje zastrzeżenia zostaną sprawdzone”.','“I do not know what Robert told you about Adam. Previously I raised concerns about tests, and later it looked as if I had approved everything. I am not asking you to take my side. I want to know whether my concerns will be checked.”')}</p></div></div><div class="hint"><strong>${T('Teraz ćwiczysz: pierwszą reakcję lidera, która może budować lub osłabiać zaufanie.','You are practicing: a leader’s first response that may build or weaken trust.')}</strong><p>${T('Nie znasz pełnej historii. Nie możesz uczciwie obiecać, że wszystko jest w porządku. Co odpowiesz?','You do not know the full story. You cannot honestly promise everything is fine. How do you respond?')}</p></div>${[[T('„Może mi Pani zaufać. U mnie takich sytuacji nie będzie”.','“You can trust me. This will not happen under my leadership.”'),T('Obietnica bez wiedzy o sytuacji','A promise without enough knowledge')],[T('„Powiedz, co zgłaszałaś, kiedy i gdzie to zapisano”.','“Tell me what you reported, when, and where it was documented.”'),T('Pytania o konkretne informacje','Questions about concrete information')],[T('„Teraz liczy się termin. Wrócimy do tego później”.','“The deadline comes first. We will revisit this later.”'),T('Odsunięcie problemu','Deferring the concern')],[T('„Nie znam całej historii. Sprawdzę dokumenty i wrócę do Ciebie z ustaleniami jutro o 10:00”.','“I do not know the whole story. I will check the documents and update you tomorrow at 10:00.”'),T('Przyznanie niewiedzy i konkretne zobowiązanie','Admitting uncertainty and making a specific commitment')]].map(([a,b],i)=>`<button class="choice" data-trustchoice="${i}" aria-pressed="${state.trustChoice===i}"><strong>${'ABCD'[i]}</strong>${a}<div class="note">${b}</div></button>`).join('')}<label><strong>${T('Dlaczego tak odpowiadasz? Jakie ryzyko niesie Twoja reakcja?','Why do you respond this way? What risk does your response carry?')}</strong><textarea id="trustWhy" class="field">${safe(state.trustWhy)}</textarea></label><div class="actions">${button(T('Zapisz odpowiedź i kontynuuj','Save response and continue'),'trustdecide',true)}</div></div>`;
if(s===16)return `<div class="scene"><div class="eyebrow">${T('11:34 · WIADOMOŚĆ OD JULII','11:34 · MESSAGE FROM JULIA')}</div><h2>${T('Słowa to dopiero początek','Words are only the beginning')}</h2><div class="message"><strong>Julia · ${T('Zestawienie testów','Test summary')}</strong><p>${T('„Przesyłam zestawienie z trzema pozycjami oznaczonymi jako wymagające wyjaśnienia. W dokumentacji nie widzę potwierdzenia, że wszystkie testy zamknięto. Nie wiem, czy istnieje nowsza wersja”.','“I am sending a summary with three items marked for clarification. I cannot see confirmation that all tests were closed. I do not know whether there is a newer version.”')}</p></div><p>${T('Robert prosi o aktualizację harmonogramu przed 12:00. Marta czeka na odpowiedź. Tomasz przypomina, że każdy dzień opóźnienia ma koszt. Nie możesz wszystkiego sprawdzić natychmiast.','Robert wants a schedule update before noon. Marta is waiting for an answer. Tomasz reminds you that every day of delay has a cost. You cannot verify everything immediately.')}</p><div class="hint"><strong>${T('Teraz ćwiczysz: wiarygodność lidera, transparentność i dotrzymywanie zobowiązań.','You are practicing: credibility, transparency, and following through.')}</strong></div>${[[T('Potwierdzam termin bez dodatkowych zastrzeżeń, by nie wywoływać niepokoju.','Confirm the deadline without caveats to avoid alarm.')],[T('Przekazuję Robertowi potwierdzone fakty i niewiadome, proszę o czas na weryfikację i ustalam, kiedy odpowiem Marcie.','Share verified facts and unknowns with Robert, request verification time, and set a time to update Marta.')],[T('Wysyłam zestawienie Julii całemu zespołowi z komentarzem, że ktoś ukrywał błędy.','Send Julia’s summary to everyone claiming someone concealed mistakes.')],[T('Przekazuję całą sprawę Marcie i czekam, aż sama wyjaśni ją z Robertem.','Hand the matter to Marta and wait for her to resolve it with Robert.')]].map(([a],i)=>`<button class="choice" data-trustaction="${i}" aria-pressed="${state.trustAction===i}"><strong>${'ABCD'[i]}</strong>${a}</button>`).join('')}<label><strong>${T('Jak konkretnie dotrzymasz słowa? Wskaż działanie, odbiorcę i termin.','How will you follow through? Specify an action, recipient, and deadline.')}</strong><textarea id="trustPlan" class="field">${safe(state.trustPlan)}</textarea></label><div class="actions">${button(T('Zobacz konsekwencje','See consequences'),'trustaction',true)}</div></div>`;
if(s===17){let o=[T('Marta słyszy zapewnienie, ale nie otrzymuje konkretów. Następnego dnia pyta, co rzeczywiście sprawdzono.','Marta heard reassurance, but no specifics. The next day she asks what was actually checked.'),T('Robert nie jest zadowolony z niepewności, ale otrzymuje jasną listę spraw do potwierdzenia. Marta widzi, że jej zastrzeżenia zostały zapisane. Zaufanie nie powstaje od razu.','Robert dislikes the uncertainty but receives a clear verification list. Marta sees her concerns recorded. Trust does not appear overnight.'),T('Julia jest zaskoczona oskarżycielskim tonem. Prosi o wyjaśnienie, skąd wzięło się stwierdzenie o ukrywaniu błędów.','Julia is surprised by the accusatory tone. She asks what supports the claim that errors were hidden.'),T('Marta odbiera przekazanie sprawy jako pozostawienie jej samej z konfliktem. Tomasz nadal czeka na decyzję.','Marta feels left alone to handle the conflict. Tomasz is still waiting for a decision.')][state.trustAction??0];return `<div class="scene"><div class="eyebrow">${T('NASTĘPNY DZIEŃ · 10:05','THE NEXT DAY · 10:05')}</div><h2>${T('Czy można Ci wierzyć?','Can people rely on you?')}</h2><div class="message"><p>${o}</p></div><p>${T('Zaufanie nie jest nagrodą za dobre intencje. Wzmacnia się, gdy ludzie widzą spójność między deklaracjami a zachowaniem — szczególnie w trudnych sytuacjach. Jedna scena nie przesądza o stanie całego zespołu.','Trust is not a reward for good intentions. It grows when people see consistency between words and actions, especially under pressure. One scene cannot establish the condition of an entire team.')}</p><div class="actions">${button(T('Przejdź do autoewaluacji','Go to self-evaluation'),'next',true)}</div></div>`}
if(s===18)return `<div class="scene"><div class="eyebrow">${T('AUTOEWALUACJA · ODCINEK 1','SELF-EVALUATION · EPISODE 1')}</div><h2>${T('Jak budujesz zaufanie?','How do you build trust?')}</h2><p>${T('Nie opisuj ogólnie „dobrego lidera”. Odwołaj się do własnych decyzji i zdarzeń z NEXORY. Odpowiedzi zapiszą się w indywidualnym raporcie.','Do not describe a “good leader” in general. Refer to your own decisions and events in NEXORA. Your responses will be saved in your individual report.')}</p><label><strong>${T('1. Które Twoje działanie mogło zwiększyć zaufanie, a które je osłabić? Dlaczego?','1. Which of your actions could strengthen trust and which could undermine it? Why?')}</strong><textarea class="field" id="trustReflection">${safe(state.trustReflection)}</textarea></label><label><strong>${T('2. Zaplanuj trzy konkretne działania na pierwszy tydzień. Po czym poznasz, że zostały wykonane?','2. Plan three concrete actions for your first week. How will you know they were completed?')}</strong><textarea class="field" id="trustWeek">${safe(state.trustWeek)}</textarea></label><label><strong>${T('3. Czy po poznaniu Lencioniego i Tuckmana zmieniłbyś pierwszą decyzję w B-204? Uzasadnij.','3. Would you change your first B-204 decision after studying Lencioni and Tuckman? Explain.')}</strong><textarea class="field" id="revisit">${safe(state.revisit)}</textarea></label><label><strong>${T('4. Wskaż obserwację, dwa możliwe wyjaśnienia i informacje potrzebne do ich rozróżnienia.','4. Identify one observation, two possible explanations, and evidence needed to distinguish them.')}</strong><textarea class="field" id="finalReflection">${safe(state.finalReflection)}</textarea></label><div class="actions">${button(T('Zapisz refleksję i przejdź do finału','Save reflection and continue'),'finishreflection',true)}</div></div>`;
if(s===19)return `<div class="scene"><div class="eyebrow">${T('17:42 · NIEZNANY NADAWCA','17:42 · UNKNOWN SENDER')}</div><h2>${T('Pod powierzchnią','Below the Surface')}</h2><div class="message"><p>${T('„Jeśli naprawdę chcesz zrozumieć, dlaczego Adam odszedł, nie pytaj, co zrobił źle. Zapytaj, czego nie wolno mu było powiedzieć”.','“If you really want to understand why Adam left, do not ask what he did wrong. Ask what he was not allowed to say.”')}</p></div><p>${T('Odcinek zakończony. W tym odcinku ćwiczyłeś wstępną diagnozę zespołu, rozumienie zaufania i przekładanie deklaracji na wiarygodne działania. Projekt zespołowy jest realizowany osobno, poza grą.','Episode complete. You practiced preliminary team diagnosis, understanding trust, and turning promises into credible actions. The team project is separate from this game.')}</p><div class="actions">${button(T('Pobierz raport PDF','Download PDF report'),'pdf',true)}${button(T('Zapisz postęp do pliku','Save progress to file'),'download')}${button(T('Wróć do początku','Return to beginning'),'restart')}</div><p class="note">${T('Raport PDF zawiera decyzje, uzasadnienia, test i refleksje. Zapis postępu służy do późniejszego wznowienia gry.','The PDF report includes decisions, rationales, quiz and reflections. The progress file is for resuming the game.')}</p></div>`;
return '';
}

function thirdQuestions(){return [
[T('Nowy kierownik mówi: „Nie wiem jeszcze, co się stało. Sprawdźmy to wspólnie”. Co pokazuje?','The new manager says: “I do not yet know what happened. Let us examine it together.” What does this show?'),T('Gotowość do ujawnienia własnej niewiedzy','Willingness to acknowledge uncertainty'),T('Utratę autorytetu','Loss of authority'),T('Rezygnację z odpowiedzialności','Avoidance of responsibility'),T('Brak potrzeby weryfikacji','No need to verify')],
[T('Dlaczego ukrywanie zastrzeżeń może utrudniać zaangażowanie?','Why can hiding concerns undermine commitment?'),T('Ogranicza otwartą debatę nad decyzją','It prevents open debate about a decision'),T('Automatycznie przyspiesza decyzje','It automatically speeds decisions'),T('Zastępuje uzgadnianie celów','It replaces agreement on goals'),T('Zwiększa przejrzystość','It increases transparency')],
[T('Jak lider może odpowiedzieć na rzeczowy sprzeciw Marty?','How can a leader respond to Marta’s substantive objection?'),T('Poprosić o dane i dopuścić debatę','Ask for evidence and invite debate'),T('Uznać sprzeciw za nielojalność','Treat dissent as disloyalty'),T('Przerwać rozmowę bez wyjaśnienia','End the discussion without explanation'),T('Zignorować wpływ na jakość','Ignore quality implications')],
[T('Zespół po zmianie kierownika ponownie ustala role. Co to może przypominać?','A team renegotiates roles after a leadership change. What might this resemble?'),T('Elementy storming, bez pewnej diagnozy','Elements of storming, without a definitive diagnosis'),T('Wyłącznie adjourning','Only adjourning'),T('Dowód braku wyników','Proof of poor results'),T('Zakończenie współpracy','End of collaboration')],
[T('Co może pomóc zespołowi przejść ku norming?','What may help a team move toward norming?'),T('Jawne uzgodnienie zasad i odpowiedzialności','Explicit agreement on norms and responsibilities'),T('Zakaz zgłaszania wątpliwości','Prohibiting concerns'),T('Ukrycie kryteriów decyzji','Concealing decision criteria'),T('Odkładanie wszystkich rozmów','Postponing all conversations')],
[T('Po zakończeniu wdrożenia zespół podsumowuje pracę i rozchodzi się. Jaki etap opisuje Tuckman i Jensen?','After launch, the team reviews its work and disbands. Which stage did Tuckman and Jensen describe?'),T('Adjourning','Adjourning'),T('Storming','Storming'),T('Forming','Forming'),T('Norming','Norming')],
[T('Robert przerywa Julii. Co jest bezpośrednią obserwacją?','Robert interrupts Julia. What is a direct observation?'),T('Julia nie dokończyła wypowiedzi','Julia did not finish speaking'),T('Robert chce ukryć błąd','Robert wants to hide an error'),T('Julia jest niekompetentna','Julia is incompetent'),T('W zespole na pewno nie ma zaufania','The team certainly lacks trust')],
[T('Dlaczego model etapów rozwoju zespołu nie powinien być sztywną etykietą?','Why should the team development model not be treated as a rigid label?'),T('Zachowania zespołu zależą od kontekstu i czasu','Team behavior depends on context and time'),T('Każdy zespół zawsze jest w jednym etapie','Every team is always in exactly one stage'),T('Jedno spotkanie daje pełną diagnozę','One meeting gives a complete diagnosis'),T('Etapy są testem osobowości','The stages are a personality test')]
]}
function quizFeedback(i,level){let topics=[
[T('U Lencioniego podstawą współpracy jest zaufanie oparte na gotowości do ujawnienia słabości i błędów — nie na deklaracjach.','For Lencioni, vulnerability-based trust includes admitting mistakes and limitations, not just making promises.')],
[T('W modelu Lencioniego brak zaufania sprzyja obawie przed konfliktem; bez otwartej debaty trudniej o rzeczywiste zaangażowanie.','In Lencioni’s model, absence of trust feeds fear of conflict; without open debate, commitment is harder.')],
[T('Konflikt dotyczący idei i danych nie jest tym samym co atak na osobę. Lider może stworzyć przestrzeń na rzeczową różnicę zdań.','Debate about ideas and evidence is not a personal attack. A leader can make space for constructive disagreement.')],
[T('Storming dotyczy m.in. napięć i negocjowania ról, lecz pojedyncze zdarzenie nie wystarcza do określenia etapu zespołu.','Storming includes tension and role negotiation, but a single incident cannot establish a team stage.')],
[T('Norming wiąże się z uzgadnianiem norm współpracy, a nie z brakiem jakichkolwiek sporów.','Norming involves shared working norms, not an absence of all disagreement.')],
[T('Adjourning dodano później do modelu: oznacza zakończenie wspólnego zadania i rozstanie zespołu.','Adjourning was added later and describes completing work and disbanding.')],
[T('Oddzielaj to, co zaobserwowano, od hipotez o motywach innych osób. Pytaj o alternatywne wyjaśnienia.','Separate observed behavior from hypotheses about motives. Consider alternative explanations.')],
[T('Tuckman proponuje ramy do interpretowania dynamiki zespołu, a nie narzędzie pewnej diagnozy po jednym spotkaniu.','Tuckman offers an interpretive framework, not a definitive diagnosis based on one meeting.')]
];return topics[i][0]+(level>=2?' '+T('Przeczytaj ponownie fragment teorii i spróbuj zastosować ją do nowego przykładu.','Review the theory and apply it to a new example.'):'')}

$('stage').addEventListener('input',e=>{if(e.target.id==='reason')state.reason=e.target.value;if(e.target.id==='reflection')state.reflection=e.target.value;if(e.target.id==='finalReflection')state.finalReflection=e.target.value;for(const k of ['trustWhy','trustPlan','trustReflection','trustWeek','revisit'])if(e.target.id===k)state[k]=e.target.value;if(e.target.dataset.team){state.team=state.team||{};state.team[e.target.dataset.team]=e.target.value}save()});
$('stage').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.trustchoice!==undefined){state.trustChoice=Number(b.dataset.trustchoice);save();render();return}if(b.dataset.trustaction!==undefined){state.trustAction=Number(b.dataset.trustaction);save();render();return}if(b.dataset.answer!==undefined){let i=Number(b.dataset.q),a=Number(b.dataset.answer);state.quiz=state.quiz||{};state.quizAttempts=state.quizAttempts||{};state.quizHistory=state.quizHistory||{};state.quizHistory[i]=state.quizHistory[i]||[];state.quizHistory[i].push({questionVersion:Math.min(state.quizAttempts[i]||0,2)+1,correct:a===0});if(a===0){state.quiz[i]=true;save();render()}else{state.quizAttempts[i]=(state.quizAttempts[i]||0)+1;save();let tries=state.quizAttempts[i];$('feedback').innerHTML='<div class="hint">'+quizFeedback(i,tries)+'</div>'+button(tries>=3?T('Przejdź do powtórki teorii','Review the theory'):T('Nowe pytanie','New question'),tries>=3?'review':'retry',true);$('stage').querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)}return}if(b.dataset.act==='review'){let i=questions().findIndex((_,j)=>state.quiz?.[j]!==true);$('feedback').innerHTML='<div class="hint"><strong>'+T('Powtórka zagadnienia','Topic review')+'</strong><p>'+quizFeedback(i,2)+'</p><p>'+T('Przypomnij sobie materiał teoretyczny z wcześniejszej części odcinka. Możesz ponownie rozpocząć zestaw pytań z tego obszaru.','Review the theoretical material from earlier in the episode. You can now restart this topic’s question set.')+'</p></div>'+button(T('Rozpocznij ten obszar od nowa','Restart this topic'),'restarttopic',true);return}if(b.dataset.act==='restarttopic'){let i=questions().findIndex((_,j)=>state.quiz?.[j]!==true);state.quizAttempts[i]=0;save();render();return}if(b.dataset.person){let k=b.dataset.person,p=people[k][state.lang];$('bio').innerHTML=`<strong>${p[0]} — ${p[1]}</strong><p>${p[2]}</p>`;return}if(b.dataset.choice!==undefined){state.choice=Number(b.dataset.choice);save();render();return}if(b.dataset.mode){state.mode=b.dataset.mode;save();render();return}let act=b.dataset.act;if(act==='next')next();if(act==='trustdecide'){if(state.trustChoice===null||state.trustWhy.trim().length<15){alert(T('Wybierz reakcję i uzasadnij ją.','Choose and justify your response.'));return}next()}if(act==='trustaction'){if(state.trustAction===null||state.trustPlan.trim().length<15){alert(T('Wybierz działanie i opisz, jak dotrzymasz zobowiązania.','Choose an action and explain how you will follow through.'));return}next()}if(act==='finishreflection'){if(['trustReflection','trustWeek','revisit','finalReflection'].some(k=>state[k].trim().length<25)){alert(T('Uzupełnij wszystkie cztery odpowiedzi (minimum 25 znaków każda).','Complete all four responses (at least 25 characters each).'));return}next()}if(act==='retry')render();if(act==='decide'){if(state.choice===null||state.reason.trim().length<15){alert(T('Wybierz decyzję i wpisz uzasadnienie (co najmniej 15 znaków).','Choose an option and enter a rationale (at least 15 characters).'));return}next()}if(act==='reflect'){if(state.reflection.trim().length<15){alert(T('Uzupełnij refleksję (co najmniej 15 znaków).','Complete your reflection (at least 15 characters).'));return}next()}if(act==='restart'){if(confirm(T('Rozpocząć od nowa?','Start again?'))){state.step=0;state.choice=null;state.reason='';state.reflection='';state.quiz={};state.quizAttempts={};state.quizHistory={};state.trustChoice=null;state.trustWhy='';state.trustAction=null;state.trustPlan='';state.trustReflection='';state.trustWeek='';state.revisit='';state.finalReflection='';render()}}if(act==='pdf'){printReport()}if(act==='download'){let data={project:'NEXORA',episode:1,prototype:true,choice:'ABCD'[state.choice??0],rationale:state.reason,mode:state.mode,reflection:state.reflection,quiz:state.quiz,quizAttempts:state.quizAttempts,quizHistory:state.quizHistory,trustChoice:state.trustChoice,trustWhy:state.trustWhy,trustAction:state.trustAction,trustPlan:state.trustPlan,trustReflection:state.trustReflection,trustWeek:state.trustWeek,revisit:state.revisit,finalReflection:state.finalReflection,exportedAt:new Date().toISOString()};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='nexora-odcinek-1-zapis.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
