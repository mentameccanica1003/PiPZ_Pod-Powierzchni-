const DATA={"scenes":[["ODCINEK 3 · NEXORA","EPISODE 3 · NEXORA","Dlaczego przestali się starać?","Why did they stop trying?","NEXORA / POD POWIERZCHNIĄ — odcinek 3. Po wydarzeniach wokół raportu Q-17 w firmie zapanowała niepokojąca cisza. Wybierz, jak chcesz wejść w tę historię.","NEXORA / BELOW THE SURFACE — episode 3. After the events surrounding report Q-17, an unsettling silence has settled over the company. Choose how you want to enter this story."],["07:58 · TABLICA PROJEKTU","07:58 · PROJECT BOARD","Wszystko jest zielone","Everything is green","Na tablicy statusów niemal wszystkie zadania mają kolor zielony. Jednak w dzienniku zmian nie ma nowych wpisów od 48 godzin. Julia przestała komentować rozbieżności. Marta realizuje wyłącznie zadania formalnie przypisane. Tomasz raportuje „zgodnie z planem”, ale jego zespół pracuje po godzinach. Robert pisze: „Przynajmniej teraz mamy spokój”.","Nearly every task on the status board is green. Yet the change log has no new entries for 48 hours. Julia has stopped commenting on discrepancies. Marta does only formally assigned tasks. Tomasz reports “on schedule”, but his team works overtime. Robert writes: “At least things are calm now.”"],["DECYZJA 1 · DIAGNOZA","DECISION 1 · DIAGNOSIS","Czy cisza oznacza zaangażowanie?","Does silence mean engagement?","Robert chce uruchomić premię za dotrzymanie terminu. Masz inne możliwości. Co robisz najpierw?","Robert wants a deadline bonus. You have other options. What do you do first?"],["KONFRONTACJA PERSPEKTYW","PERSPECTIVE CHALLENGE","Trzy głosy, trzy ryzyka","Three voices, three risks","Zatrzymaj się przed poznaniem konsekwencji. Co Twój wybór zakłada o przyczynach wycofania?","Pause before seeing consequences. What does your choice assume about disengagement?"],["09:20 · PIERWSZY SKUTEK","09:20 · FIRST CONSEQUENCE","To nie jest kwestia samej premii","It is not just about the bonus","Każda interwencja odsłania inny fragment problemu.","Each intervention reveals a different part of the problem."],["AKTA · TRZY PERSPEKTYWY","CASE FILE · THREE PERSPECTIVES","Nie wszyscy przestali się starać z tego samego powodu","Not everyone stopped trying for the same reason","Marta: „Nie będę znowu walczyć o prawo do powiedzenia, że test jest niekompletny”. Julia: „Kiedy poprawiam dane, nikt nie mówi, co się z nimi dalej dzieje”. Tomasz: „Nie mogę prosić ludzi o kolejne nadgodziny i mówić, że wszystko jest w porządku”. To nie są diagnozy psychologiczne, lecz sygnały dotyczące pracy.","Marta: “I will not fight again for the right to say a test is incomplete.” Julia: “When I correct the data, no one tells me what happens next.” Tomasz: “I cannot ask people for more overtime and say everything is fine.” These are not psychological diagnoses but signals about work."],["DECYZJA 2 · ROZMOWA","DECISION 2 · CONVERSATION","Julia chce odejść z projektu?","Does Julia want to leave the project?","Julia prosi o pięć minut rozmowy. „Nie wiem, czy moje analizy w ogóle coś zmieniają”. Jak reagujesz?","Julia asks for five minutes. “I do not know whether my analyses change anything.” How do you respond?"],["10:35 · REAKCJA JULII","10:35 · JULIA’S RESPONSE","Nie chodzi tylko o słowa","It is not just about words","Zobacz, jak Twoja reakcja wpływa na gotowość Julii do dalszej rozmowy.","See how your response affects Julia’s willingness to keep talking."],["12:10 · KARTKA ADAMA","12:10 · ADAM’S NOTE","„Ludzie nie milkną bez powodu”","“People do not go silent for no reason”","W archiwum projektu znajdujesz roboczą notatkę Adama: „Kiedy zgłaszanie ryzyka staje się kosztowniejsze niż milczenie, system sam produkuje zielone statusy”. Nie wiesz, czy Adam miał rację. Wiesz natomiast, że obecny sposób raportowania nie pokazuje wszystkiego.","In the project archive, you find Adam’s draft note: “When raising a risk costs more than staying silent, the system produces green statuses on its own.” You do not know whether Adam was right. You do know that current reporting does not show everything."],["DECYZJA 3 · EKSPERYMENT","DECISION 3 · EXPERIMENT","Co zmienisz w ciągu tygodnia?","What will you change within a week?","Nie możesz obiecać podwyżek ani przesunąć terminu bez zgody klienta. Możesz zmienić organizację pracy. Co proponujesz?","You cannot promise raises or move the deadline without client approval. You can change how work is organised. What do you propose?"],["15:30 · PIERWSZE EFEKTY","15:30 · EARLY EFFECTS","Zaangażowania nie da się zadekretować","Engagement cannot be decreed","Sprawdź skutki wybranej interwencji i to, co nadal pozostaje nierozwiązane.","Review the consequences of your intervention and what remains unresolved."],["BAZA WIEDZY · 1/2","LEARNING FILE · 1/2","Co naprawdę napędza działanie?","What actually drives action?","Motywacja nie jest cechą, którą lider może po prostu „włączyć”. Rozpoznaj potrzeby, bariery i warunki wykonywania pracy.","Motivation is not a trait a leader can simply switch on. Identify needs, barriers and working conditions."],["BAZA WIEDZY · 2/2","LEARNING FILE · 2/2","Wpływ, sens i granice obciążenia","Influence, meaning and workload limits","Pracownik może być kompetentny i jednocześnie wyczerpany. Inicjatywa wymaga możliwości działania.","An employee can be competent and exhausted at the same time. Initiative requires the opportunity to act."],["TEST UCZĄCY","LEARNING QUIZ","Sprawdź, jak rozumiesz motywację","Check your understanding of motivation","Osiem obszarów, trzy alternatywne pytania na każdy. Po błędzie otrzymasz wyjaśnienie i nowe pytanie.","Eight areas, three alternative questions per area. After a mistake you receive an explanation and a new question."],["17:42 · PILNY SYGNAŁ","17:42 · URGENT ALERT","Czerwony sygnał","Red alert","Julia przesyła nowy zrzut raportu. W systemie klienta nadal są rozbieżności, ale dashboard pokazuje zielony status. Marta nie podpisze potwierdzenia jakości. Tomasz ostrzega, że kolejna noc pracy przeciąży zespół. Robert chce rano pokazać raport zarządowi i mówi: „Dopiero odzyskaliśmy spokój. Nie możemy zaczynać od nowa”. Musisz podjąć decyzję przed 18:00.","Julia sends a new report screenshot. The client system still contains discrepancies, but the dashboard shows green status. Marta refuses to sign off on quality. Tomasz warns that another overnight push will overload the team. Robert wants to present the report to the board tomorrow morning: “We have only just regained calm. We cannot start over.” You must decide before 18:00."],["18:06 · KONSEKWENCJE","18:06 · CONSEQUENCES","Cena zielonego statusu","The cost of green status","Twoja decyzja wpływa jednocześnie na rzetelność raportowania, obciążenie ludzi i ich gotowość do zgłaszania problemów.","Your decision affects reporting integrity, people’s workload, and their willingness to speak up."],["REFLEKSJA INDYWIDUALNA","INDIVIDUAL REFLECTION","Co zrobisz jako lider?","What will you do as a leader?","Oddziel działania możliwe do podjęcia od obietnic, których nie możesz spełnić.","Separate feasible actions from promises you cannot keep."],["17:42 · WIADOMOŚĆ","17:42 · MESSAGE","Status zielony","Green status","Na ekranie pojawia się anonimowa wiadomość: „W raporcie sprzed odejścia Adama wszystko było zielone. Zapytaj, kto ustalił, co wolno oznaczyć na czerwono”. Zanim zdążysz odpowiedzieć, nadawca znika.","An anonymous message appears: “In the report before Adam left, everything was green. Ask who decided what could be marked red.” Before you can respond, the sender disappears."],["RAPORT · ODCINEK 3","REPORT · EPISODE 3","Twój ślad decyzyjny","Your decision trail","Zapisz postęp do pliku i wygeneruj raport PDF. Oceniamy jakość uzasadnień i refleksji, nie sam wybór litery.","Save progress to file and generate a PDF report. Reasoning and reflection are assessed, not the letter chosen."],["KONIEC ODCINKA 3","END OF EPISODE 3","Cisza nie jest zgodą","Silence is not agreement","NEXORA wraca do działania, ale nie wszystkie bariery zostały usunięte. W odcinku 4 przyjdzie czas na rozmowę, której nie da się już odłożyć.","NEXORA resumes work, but not all barriers have been removed. Episode 4 brings a conversation that can no longer be postponed."]],"choices":{"first":[["Ogłosić premię za termin i zażądać cotygodniowych wyników.","Announce a deadline bonus and require weekly performance figures."],["Porozmawiać indywidualnie z zespołem o przeszkodach, potrzebach i poczuciu wpływu.","Speak individually with team members about barriers, needs and influence."],["Zorganizować wspólną sesję pomysłów bez zmiany priorytetów ani obciążenia.","Hold a joint ideas session without changing priorities or workload."],["Samodzielnie przejąć wszystkie trudne decyzje, by odciążyć zespół.","Take all difficult decisions yourself to relieve the team."]],"talk":[["„Potrzebuję, żebyś wróciła do dawnej energii. Wszyscy są zmęczeni”.","“I need your old energy back. Everyone is tired.”"],["„Zauważyłam, że rzadziej komentujesz analizy. Co się zmieniło? Co mogłoby pomóc?”.","“I noticed you comment on analyses less often. What has changed? What might help?”"],["„Jeśli zostaniesz, załatwię Ci awans”.","“If you stay, I will arrange a promotion.”"],["„Może po prostu nie pasuje Ci ta rola. Zastanów się nad zmianą”.","“Maybe this role is not for you. Consider a change.”"]],"plan":[["Wprowadzić ranking inicjatywy i publicznie wyróżniać najaktywniejszych.","Introduce an initiative ranking and publicly praise the most active."],["Uzgodnić tydzień pilotażu: jasne priorytety, limit pracy po godzinach, dostęp do danych i przegląd pomysłów.","Agree on a one-week pilot: clear priorities, overtime limits, data access and idea reviews."],["Pozwolić każdemu zmienić zakres pracy bez uzgadniania zależności.","Let everyone change their work scope without coordinating dependencies."],["Odłożyć temat motywacji do zakończenia wdrożenia.","Postpone motivation concerns until deployment ends."]]},"outcomes":{"first":[["Premia poprawia tempo aktualizacji tablicy, ale Julia nadal nie zgłasza rozbieżności. Tomasz pyta, kto pokryje nadgodziny.","The bonus speeds up board updates, but Julia still does not flag discrepancies. Tomasz asks who will cover overtime."],["Marta mówi o ignorowanych ostrzeżeniach, Julia o braku informacji zwrotnej, Tomasz o przeciążeniu. Nie masz jeszcze rozwiązania, ale znasz trzy różne bariery.","Marta mentions ignored warnings, Julia missing feedback, Tomasz overload. You do not yet have a solution, but you know three different barriers."],["Pojawiają się dwa pomysły. Po spotkaniu nikt nie ma czasu ich wdrożyć; kolejna sesja bez decyzji grozi rozczarowaniem.","Two ideas emerge. Afterwards no one has time to implement them; another meeting without decisions risks disappointment."],["Przez dzień jest ciszej. Następnego dnia pięć decyzji czeka wyłącznie na Ciebie. Zespół przestaje brać odpowiedzialność.","It is quieter for a day. The next day five decisions await you alone. The team stops taking responsibility."]],"talk":[["Julia odpowiada: „Nie chodzi o energię. Nie wiem, co dzieje się z moimi poprawkami”. Rozmowa staje się trudniejsza.","Julia replies: “It is not about energy. I do not know what happens to my corrections.” The conversation becomes harder."],["Julia pokazuje trzy poprawki, które zniknęły z kolejnych wersji raportu. Prosi nie o pochwałę, ale o informację, kto i dlaczego zmienił decyzję.","Julia shows three corrections that disappeared from later report versions. She asks not for praise, but to know who changed the decision and why."],["Julia pyta: „Czy możesz mi to zagwarantować?”. Nie możesz. Obietnica ryzykuje utratę wiarygodności.","Julia asks: “Can you guarantee that?” You cannot. The promise risks your credibility."],["Julia milknie. Następnego dnia przesyła tylko minimalny raport. Być może chciała rozmawiać o warunkach pracy, nie o odejściu.","Julia falls silent. The next day she sends only a minimal report. She may have wanted to discuss working conditions, not leaving."]],"plan":[["Ranking zwiększa liczbę drobnych zgłoszeń, ale zespół zaczyna unikać trudnych tematów, których nie da się szybko zamknąć.","The ranking increases small suggestions, but the team avoids difficult issues that cannot be closed quickly."],["Po tygodniu Julia zgłasza dwa ryzyka z propozycją weryfikacji. Tomasz ogranicza nadgodziny. Marta nadal nie ufa systemowi zatwierdzeń — trzeba wrócić do kryteriów.","After a week Julia raises two risks with verification plans. Tomasz reduces overtime. Marta still distrusts sign-off rules—criteria need review."],["Marta i Tomasz wprowadzają sprzeczne zmiany. Autonomia bez koordynacji powoduje nowe napięcia.","Marta and Tomasz make conflicting changes. Autonomy without coordination creates new tensions."],["Tablica pozostaje zielona. Przeciążenie i brak wpływu nie znikają od odłożenia rozmowy.","The board remains green. Overload and lack of influence do not disappear when the conversation is postponed."]]},"areas":[["Motywacja wewnętrzna i zewnętrzna","Intrinsic and extrinsic motivation",[["Julia nadal analizuje niespójności, choć nie ma za to dodatkowej nagrody. Który wniosek jest NAJLEPIEJ uzasadniony?","Julia keeps investigating inconsistencies without an extra reward. Which conclusion is BEST supported?","Może czerpać satysfakcję z samego rozwiązywania problemu, ale trzeba to sprawdzić w rozmowie.","She may find the problem-solving itself satisfying, but this should be checked in conversation.","Jej zachowanie dowodzi, że nagrody zewnętrzne nigdy nie wpływają na jej pracę.","Her behaviour proves that external rewards never affect her work.","Skoro nie oczekuje premii, jej motywacja musi wynikać wyłącznie z identyfikacji z firmą.","If she expects no bonus, her motivation must come solely from identification with the company.","Obserwacja jest zgodna z motywacją wewnętrzną, lecz nie pozwala jednoznacznie ustalić motywu.","The observation is consistent with intrinsic motivation but does not establish the motive conclusively."],["Robert proponuje premię za termin, ale Marta obawia się pominięcia testów. Co jest najbardziej trafną oceną?","Robert offers a deadline bonus, but Marta fears tests will be skipped. What is the most accurate assessment?","Premia może ukierunkować wysiłek na termin; jej kryteria trzeba powiązać również z jakością.","A bonus may direct effort towards the deadline; its criteria should also reflect quality.","Premia zawsze osłabi motywację wewnętrzną, więc należy ją odrzucić bez analizy.","A bonus always undermines intrinsic motivation, so it must be rejected without analysis.","Premia rozwiąże spór, jeśli będzie jednakowa dla wszystkich, niezależnie od zakresu obowiązków.","A bonus will resolve the dispute if identical for everyone, regardless of duties.","System nagród kształtuje zachowania przez kryteria; nie można przewidzieć jednego skutku w każdej sytuacji.","Reward systems shape behaviour through their criteria; one universal outcome cannot be assumed."],["Tomasz chce uznania za uratowanie harmonogramu, ale mówi też, że lubi koordynować trudne wdrożenia. Co z tego wynika?","Tomasz wants recognition for saving the schedule but also enjoys coordinating difficult rollouts. What follows?","Motywacja zewnętrzna i wewnętrzna mogą współwystępować u tej samej osoby.","Intrinsic and extrinsic motives can coexist in one person.","Chęć uznania wyklucza autentyczne zainteresowanie pracą.","Seeking recognition rules out genuine interest in the work.","Zainteresowanie zadaniem oznacza, że informacja zwrotna nie ma znaczenia.","Interest in a task means feedback is irrelevant.","Motywy mogą się nakładać, dlatego diagnoza wymaga uwzględnienia kontekstu.","Motives can overlap, so diagnosis must consider context."]]],["Diagnoza spadku zaangażowania","Diagnosing disengagement",[["Julia przestała komentować raporty po tym, jak dwa razy zignorowano jej uwagi. Co powinien najpierw zrobić lider?","Julia stopped commenting on reports after her concerns were ignored twice. What should the leader do first?","Oddzielić obserwowane milczenie od hipotezy o jego przyczynie i zapytać o bariery zgłaszania uwag.","Separate observed silence from hypotheses about its cause and ask about barriers to speaking up.","Uznać, że Julia wycofała się z powodu niskiej odporności na krytykę.","Conclude that Julia withdrew because she cannot handle criticism.","Przywrócić obowiązkową liczbę komentarzy bez pytania o ich jakość.","Mandate a number of comments without asking about their quality.","Zachowanie jest obserwowalne, ale przypisanie mu motywu wymaga dodatkowych danych.","The behaviour is observable, but attributing a motive requires additional evidence."],["Tablica zadań jest zielona, lecz zespół nie zgłasza ryzyk. Który wskaźnik najlepiej uzupełni obraz?","The task board is green, but the team reports no risks. Which indicator best complements the picture?","Liczba zgłoszonych problemów wraz z tym, jak szybko i rzeczowo organizacja na nie reaguje.","Number of issues raised together with how promptly and constructively the organisation responds.","Wyłącznie odsetek zadań oznaczonych jako zakończone.","Only the percentage of tasks marked completed.","Liczba godzin spędzonych przy komputerze przez każdą osobę.","Hours each person spends at their computer.","Same wyniki realizacji nie pokazują jakości informacji zwrotnej ani gotowości do zgłaszania problemów.","Delivery metrics alone do not reveal feedback quality or willingness to raise concerns."],["Marta wykonuje tylko formalnie przypisane zadania. Która interpretacja jest najmniej pochopna?","Marta only performs formally assigned tasks. Which interpretation is least premature?","To może oznaczać ochronę granic roli po konflikcie; potrzebna jest rozmowa o warunkach współpracy.","This may reflect protecting role boundaries after conflict; a discussion about working conditions is needed.","To pewny dowód, że Marta chce sabotować wdrożenie.","This proves Marta intends to sabotage the rollout.","To dowód, że wcześniej nie znała zakresu swoich obowiązków.","This proves she previously did not know her responsibilities.","Jedno zachowanie może mieć kilka wyjaśnień; lider powinien testować hipotezy.","One behaviour can have multiple explanations; a leader should test hypotheses."]]],["Indywidualizacja motywowania","Individualising motivation",[["Marta chce wpływu na kryteria jakości, a Tomasz przewidywalnego planu. Jaka interwencja najlepiej godzi te potrzeby?","Marta wants influence over quality criteria; Tomasz wants a predictable plan. Which intervention best reconciles them?","Ustalić wspólne punkty kontrolne jakości i terminy decyzji, pozostawiając obu realny wpływ w ich obszarach.","Agree shared quality checkpoints and decision deadlines while giving both real influence in their areas.","Dać każdemu identyczną swobodę bez określenia odpowiedzialności.","Give both identical autonomy without defining accountability.","Pozwolić Tomaszowi samodzielnie ustalać kryteria testów, bo odpowiada za harmonogram.","Let Tomasz set test criteria alone because he owns the schedule.","Równe traktowanie nie oznacza identycznych narzędzi; potrzeby można pogodzić przez strukturę współpracy.","Fair treatment does not require identical tools; needs can be reconciled through collaboration structure."],["Robert proponuje wszystkim ten sam cel rozwojowy. Jakie jest główne ryzyko?","Robert proposes the same development goal for everyone. What is the main risk?","Cel może nie odpowiadać różnym kompetencjom, rolom i aspiracjom pracowników.","The goal may not fit employees' different skills, roles and aspirations.","Wspólny cel zawsze narusza sprawiedliwość proceduralną.","A shared goal always violates procedural fairness.","Indywidualne cele uniemożliwiają współpracę zespołową.","Individual goals prevent teamwork.","Indywidualizacja wymaga diagnozy, lecz może współistnieć ze wspólnymi celami zespołu.","Individualisation requires diagnosis but can coexist with shared team goals."],["Julia chce autonomii, ale dostęp do danych wymaga zgody Roberta. Co jest najbardziej adekwatne?","Julia wants autonomy, but Robert must approve access to data. What is most appropriate?","Uzgodnić zakres samodzielnych analiz i jasne reguły dostępu oraz eskalacji.","Agree the scope of independent analysis and clear access and escalation rules.","Dać Julii pełną swobodę obchodzenia zasad dostępu.","Give Julia full freedom to bypass access rules.","Zrezygnować z autonomii, bo istnieją formalne ograniczenia.","Abandon autonomy because formal constraints exist.","Autonomia oznacza wpływ w uzgodnionych granicach, nie brak jakichkolwiek zasad.","Autonomy means influence within agreed boundaries, not the absence of rules."]]],["Job crafting","Job crafting",[["Julia proponuje zmienić kolejność analiz, aby szybciej wychwytywać anomalie. Jak najlepiej sklasyfikować zmianę?","Julia proposes changing the order of analyses to spot anomalies earlier. How should it be classified?","Task crafting, o ile zmiana zakresu lub sposobu wykonywania zadań zostanie uzgodniona.","Task crafting, provided the change in tasks or methods is agreed.","Relational crafting, bo wymaga komunikacji z Robertem.","Relational crafting because it involves communicating with Robert.","Cognitive crafting, bo Julia zaczyna inaczej postrzegać swoją rolę.","Cognitive crafting because Julia sees her role differently.","Zmiana sposobu wykonywania pracy dotyczy przede wszystkim wymiaru zadaniowego.","Changing how work is performed primarily concerns the task dimension."],["Marta chce regularnie konsultować ryzyka z zespołem wdrożeniowym. Jaki mechanizm job craftingu dominuje?","Marta wants regular risk consultations with the implementation team. Which job crafting mechanism dominates?","Relational crafting — świadoma zmiana kontaktów i współpracy w pracy.","Relational crafting — intentionally reshaping work interactions.","Task crafting — wyłącznie zmiana liczby testów.","Task crafting — solely changing the number of tests.","Cognitive crafting — zmiana interpretacji celu pracy bez zmiany kontaktów.","Cognitive crafting — reframing work purpose without changing interactions.","W centrum jest przebudowa relacji roboczych, nawet jeśli wpływa ona na zadania.","The core change is to work relationships, even if tasks are also affected."],["Tomasz zaczyna postrzegać raportowanie nie jako kontrolę, lecz jako ochronę klientów przed błędami. Co się zmienia?","Tomasz begins to view reporting not as surveillance but as protecting clients from errors. What changes?","Cognitive crafting — znaczenie przypisywane tej samej pracy.","Cognitive crafting — the meaning attached to the same work.","Task crafting — formalny zakres obowiązków.","Task crafting — the formal scope of duties.","Relational crafting — skład zespołu.","Relational crafting — team membership.","Przekształca się interpretacja sensu pracy, niekoniecznie jej zadania lub relacje.","The interpretation of work meaning changes, not necessarily tasks or relationships."]]],["Proaktywność","Proactivity",[["Julia zgłasza ryzyko, ale nie ma uprawnień do zmiany systemu. Co jest najlepszą reakcją lidera?","Julia raises a risk but lacks authority to change the system. What is the best leader response?","Docenić sygnał, uzgodnić właściciela decyzji i termin weryfikacji, nie przerzucając odpowiedzialności.","Acknowledge the signal, agree a decision owner and review date without shifting responsibility.","Uznać, że bez gotowego rozwiązania zgłoszenie nie jest proaktywne.","Decide that without a complete solution the report is not proactive.","Powierzyć Julii samodzielne wdrożenie mimo braku uprawnień.","Assign Julia the implementation despite her lack of authority.","Proaktywność potrzebuje reakcji organizacji i dostępu do realnych ścieżek działania.","Proactivity needs an organisational response and viable paths to action."],["Robert chce mierzyć inicjatywę liczbą pomysłów miesięcznie. Co jest największym ograniczeniem takiego miernika?","Robert wants to measure initiative by the number of ideas per month. What is the biggest limitation?","Może premiować ilość zamiast wartości i zniechęcać do zgłaszania trudnych ryzyk.","It may reward volume rather than value and discourage raising difficult risks.","Nie da się nigdy policzyć żadnych przejawów inicjatywy.","No form of initiative can ever be counted.","Każdy pomysł jest równie użyteczny, więc miara jest wystarczająca.","Every idea is equally useful, so the metric is sufficient.","Wskaźniki powinny uwzględniać jakość, wdrożenie i reakcję na zgłoszenia.","Metrics should consider quality, implementation and responses to proposals."],["Po nieudanej próbie usprawnienia Tomasz obawia się kolejnej inicjatywy. Co najbardziej sprzyja uczeniu się?","After an unsuccessful improvement attempt, Tomasz fears trying again. What best supports learning?","Omówić założenia, ograniczenia i wnioski bez automatycznego przypisywania winy.","Review assumptions, constraints and lessons without automatically assigning blame.","Publicznie wskazać Tomasza jako przykład nieskuteczności.","Publicly identify Tomasz as an example of failure.","Zrezygnować z jakichkolwiek prób usprawniania do końca projektu.","Stop all improvement attempts until the project ends.","Uczenie się wymaga analizy przyczyn i warunków, a nie wyłącznie oceny osoby.","Learning requires analysis of causes and conditions, not merely judging a person."]]],["Przeciążenie i wypalenie","Overload and burnout",[["Tomasz pracuje po godzinach, jest rozdrażniony i mówi o braku energii. Jaki wniosek jest uprawniony?","Tomasz works overtime, is irritable and reports low energy. What conclusion is justified?","Istnieje sygnał możliwego przeciążenia; lider powinien zbadać wymagania i zasoby, nie stawiać diagnozy.","There is a possible overload signal; the leader should examine demands and resources without diagnosing.","To wystarcza do rozpoznania klinicznego wypalenia.","This is sufficient for a clinical burnout diagnosis.","To typowy objaw niskiej motywacji, więc potrzebna jest premia.","This is a typical sign of low motivation, so a bonus is needed.","Objawy wymagają rozmowy o pracy i ewentualnego wsparcia, ale nie przesądzają o diagnozie.","Symptoms warrant a discussion about work and possible support, but do not establish a diagnosis."],["Zespół zgłasza chroniczne nadgodziny. Która interwencja najlepiej odpowiada na źródło ryzyka?","The team reports chronic overtime. Which intervention best addresses the source of risk?","Zweryfikować obciążenie, priorytety, terminy i dostępne zasoby przed żądaniem większego wysiłku.","Review workload, priorities, deadlines and resources before demanding more effort.","Zorganizować wyłącznie warsztat odporności psychicznej bez zmian w pracy.","Run only a resilience workshop without changing work conditions.","Wprowadzić konkurs na najbardziej zaangażowanego pracownika.","Introduce an employee-of-the-month competition.","Interwencja organizacyjna powinna dotyczyć wymagań i zasobów, nie tylko zachowania jednostki.","An organisational intervention should address demands and resources, not only individual behaviour."],["Kiedy można mówić o wypaleniu w rozumieniu ICD-11?","When can burnout be discussed in the ICD-11 sense?","Jako o zjawisku zawodowym związanym z przewlekłym stresem w pracy, którego nie udało się skutecznie opanować.","As an occupational phenomenon related to chronic workplace stress that has not been successfully managed.","Jako o dowolnym zmęczeniu po intensywnym dniu.","As any tiredness after a demanding day.","Jako o rozpoznaniu, które kierownik może postawić na podstawie jednego spotkania.","As a diagnosis a manager can make after one meeting.","ICD-11 ujmuje wypalenie jako zjawisko zawodowe, a nie samodzielną jednostkę chorobową.","ICD-11 describes burnout as an occupational phenomenon, not a medical condition."]]],["Rozmowa motywująca","Motivational conversation",[["Julia mówi: „Po co mam zgłaszać uwagi, skoro i tak nic się nie zmienia?”. Która odpowiedź najlepiej otwiera rozmowę?","Julia says: 'Why raise concerns when nothing changes?' Which reply best opens a conversation?","„Słyszę, że wcześniejsze zgłoszenia nie przyniosły reakcji. Która sytuacja była dla Ciebie najważniejsza?”","'I hear earlier reports got no response. Which situation mattered most to you?'","„Nie przesadzaj, każdy musi czasem zaakceptować decyzję przełożonego”.","'Don't exaggerate; everyone must sometimes accept a manager's decision.'","„Od jutra masz zgłaszać co najmniej trzy uwagi tygodniowo”.","'From tomorrow you must submit at least three concerns a week.'","Nazwanie obserwacji i pytanie otwarte pozwala rozpoznać doświadczenie bez przyjmowania gotowej diagnozy.","Reflecting the concern and asking an open question explores experience without imposing a diagnosis."],["Marta chce zmiany, ale obawia się kolejnego konfliktu z Robertem. Co najlepiej wspiera jej sprawczość?","Marta wants change but fears another conflict with Robert. What best supports her agency?","Wspólnie ustalić konkretny, bezpieczny sposób zgłoszenia problemu i kryterium reakcji.","Agree a concrete, safe way to raise the issue and a criterion for responding.","Zadeklarować, że Robert nigdy więcej nie będzie się z nią nie zgadzał.","Promise Robert will never disagree with her again.","Wyręczyć Martę we wszystkich przyszłych rozmowach.","Take over all of Marta's future conversations.","Sprawczość rośnie dzięki realnym możliwościom działania i przewidywalnej reakcji.","Agency grows through genuine options for action and predictable responses."],["Po rozmowie Tomasz deklaruje poprawę, lecz nie uzgodniono żadnych warunków. Co jest brakującym elementem?","After a conversation Tomasz promises improvement, but no conditions were agreed. What is missing?","Konkretny krok, wsparcie, termin i sposób wspólnego sprawdzenia rezultatu.","A concrete step, support, deadline and a joint way to review the result.","Silniejsze wezwanie do większego zaangażowania.","A stronger appeal to be more committed.","Publiczne porównanie Tomasza z Martą.","Public comparison of Tomasz with Marta.","Deklaracja bez warunków realizacji i przeglądu trudno przekłada się na trwałą zmianę.","A promise without implementation conditions and review is unlikely to translate into sustained change."]]],["Etyka i sprawiedliwość motywowania","Ethics and fairness in motivation",[["Robert chce nagrodzić tylko osoby zgłaszające dużo pomysłów. Co może naruszać sprawiedliwość?","Robert wants to reward only people who submit many ideas. What could undermine fairness?","Brak uwzględnienia jakości pomysłów, różnic ról i możliwości ich zgłaszania.","Ignoring idea quality, role differences and opportunities to contribute.","Samo istnienie jawnych kryteriów oceny.","The very existence of transparent assessment criteria.","Rozmowa z pracownikami o warunkach udziału.","Discussing participation conditions with employees.","Sprawiedliwość wymaga uzasadnionych kryteriów i dostępu do możliwości udziału.","Fairness requires defensible criteria and access to participation opportunities."],["Lider obiecuje Julii awans, aby odzyskać jej zaangażowanie, choć nie ma kompetencji do podjęcia tej decyzji. Co jest głównym problemem?","The leader promises Julia a promotion to restore engagement but lacks authority to grant it. What is the main problem?","Obietnica bez uprawnień podważa wiarygodność i może zwiększyć rozczarowanie.","A promise without authority undermines credibility and may deepen disappointment.","Każda rozmowa o rozwoju jest manipulacją.","Every development discussion is manipulation.","Awans zawsze osłabia motywację wewnętrzną.","Promotion always undermines intrinsic motivation.","Lider powinien odróżniać możliwości, które może zapewnić, od tych zależnych od innych decyzji.","Leaders should distinguish what they can deliver from what depends on others."],["Aby poprawić atmosferę, Robert proponuje pominąć testy i ogłosić sukces. Jak powinien odpowiedzieć lider?","To improve morale, Robert suggests skipping tests and declaring success. How should the leader respond?","Utrzymać kryteria jakości, jednocześnie negocjując realny zakres, zasoby i terminy.","Maintain quality criteria while negotiating realistic scope, resources and deadlines.","Zgodzić się, jeśli większość zespołu poczuje ulgę.","Agree if most of the team will feel relieved.","Zrzucić całą odpowiedzialność za decyzję na Martę.","Shift all responsibility for the decision onto Marta.","Motywowanie nie uzasadnia ukrywania ryzyka ani rezygnacji z odpowiedzialności za jakość.","Motivation does not justify hiding risk or abandoning quality accountability."]]]],"finalChoices":[["Wstrzymujesz publikację zielonego statusu, dokumentujesz rozbieżności i zwołujesz krótką rozmowę z Robertem, Martą, Julią i Tomaszem. Ustalasz minimalny zakres weryfikacji, odpowiedzialność i realny termin, bez automatycznego zlecania nadgodzin.","You hold the green-status publication, document discrepancies and convene a short meeting with Robert, Marta, Julia and Tomasz. You agree minimum verification, ownership and a realistic deadline without automatically imposing overtime."],["Pozostawiasz zielony status na rano, ale obiecujesz, że po prezentacji przeprowadzisz pełny przegląd problemów.","You leave the green status in place for the morning and promise a full review after the presentation."],["Żądasz od Marty i Julii natychmiastowego usunięcia wszystkich rozbieżności, nawet jeśli oznacza to pracę przez noc.","You demand that Marta and Julia fix every discrepancy immediately, even if that means working overnight."],["Wysyłasz do zarządu ostrzegawczą wiadomość bez wcześniejszej rozmowy z zespołem i bez sprawdzenia, które rozbieżności są krytyczne.","You send the board a warning without first consulting the team or checking which discrepancies are critical."]],"finalOutcomes":[["Robert jest niezadowolony z opóźnienia, ale otrzymuje udokumentowane ryzyko i plan weryfikacji. Julia widzi, że zgłoszenie uruchomiło działanie; Tomasz uczestniczy w ustalaniu realistycznego obciążenia. Konflikt nie znika, lecz staje się możliwy do zarządzania.","Robert dislikes the delay but receives documented risk and a verification plan. Julia sees that speaking up led to action; Tomasz helps set a realistic workload. The conflict does not disappear, but becomes manageable."],["Prezentacja przebiega spokojnie, jednak zielony status pozostaje niezgodny z wiedzą zespołu. Julia i Marta odczytują to jako kolejny sygnał, że ostrzeganie nie ma sensu.","The presentation goes smoothly, but green status still contradicts what the team knows. Julia and Marta take this as another sign that warnings are pointless."],["Część problemów zostaje poprawiona, ale zespół pracuje pod presją i bez priorytetów. Tomasz ostrzega o błędach wynikających ze zmęczenia; ludzie uczą się, że zgłaszanie ryzyka oznacza dodatkową karę w postaci nadgodzin.","Some problems are fixed, but the team works under pressure without priorities. Tomasz warns about fatigue-related errors; people learn that reporting risk leads to punishment through overtime."],["Zarząd dowiaduje się o ryzyku, lecz Robert i zespół czują się pominięci. Bez weryfikacji skali problemu łatwo o eskalację i utratę zaufania do procesu.","The board learns about the risk, but Robert and the team feel bypassed. Without checking the scale of the issue, escalation and loss of trust become more likely."]]};

const note=(id,pl,en)=>`<label for="n_${id}"><strong>${T(pl,en)}</strong></label><textarea class="entry" id="n_${id}" data-note="${id}" placeholder="${T('Zapisz własne uzasadnienie…','Write your own rationale…')}">${esc(S.notes[id]||'')}</textarea>`;
const optionButtons=key=>DATA.choices[key].map((a,i)=>`<button class="btn choice ${S.decisions[key]===i?'selected':''}" data-choice="${key}" data-val="${i}"><strong>${'ABCD'[i]}.</strong> ${esc(tr(a))}${S.decisions[key]===i?' ✓':''}</button>`).join('');
const people={robert:['Robert','Dyrektor operacyjny','Operations director','Presja klienta i termin.','Client pressure and deadlines.'],marta:['Marta','Starsza specjalistka','Senior specialist','Jakość testów i wpływ na decyzje.','Test quality and influence on decisions.'],tomasz:['Tomasz','Koordynator wdrożenia','Implementation coordinator','Przeciążenie i zależności w harmonogramie.','Overload and scheduling dependencies.'],julia:['Julia','Analityczka','Analyst','Niewidoczna praca nad danymi.','Invisible work on data.'],adam:['Adam Wysocki','Poprzedni kierownik','Previous manager','Odszedł trzy tygodnie przed Twoim przyjściem.','Left three weeks before you arrived.'],anna:['Anna','Psycholożka organizacji','Organisational psychologist','Ekspertka w trybie samodzielnym.','Solo-mode expert.'],marek:['Marek','Dyrektor operacyjny','Operations director','Ekspert w trybie samodzielnym.','Solo-mode expert.'],karolina:['Karolina','Kierowniczka projektu','Project manager','Ekspertka w trybie samodzielnym.','Solo-mode expert.']};
const portrait=id=>`<div class="character"><img src="assets/${id}.webp" alt="${esc(people[id][0])}"><div><strong>${esc(people[id][0])}</strong><p>${esc(T(people[id][1],people[id][2]))}</p><p class="subtle">${esc(T(people[id][3],people[id][4]))}</p></div></div>`;
const standalonePrologue=()=>`<div class="scene"><div class="eyebrow">${T('WCZEŚNIEJ W NEXORZE…','PREVIOUSLY IN NEXORA…')}</div><h1>${T('Zanim zapadła cisza','Before the silence')}</h1><p>${T('To jeden spójny wariant wcześniejszych wydarzeń, przyjęty na potrzeby osobnej rozgrywki. Nie są to decyzje podjęte przez Ciebie.','This is one coherent version of earlier events, used for standalone play. These are not decisions you made.')}</p><div class="panel"><h3>${T('Odcinek 1 — Pierwszy dzień','Episode 1 — First day')}</h3><p>${T('NEXORA wdraża dla klienta system raportowania operacyjnego i jakości. Po nagłym odejściu poprzedniego kierownika, Adama Wysockiego, przejmujesz zespół, w którym zaufanie jest kruche. W przyjętym wariancie nowy kierownik zaczyna od wysłuchania ludzi i ustalenia zasad współpracy, ale nie usuwa wszystkich napięć.','NEXORA is implementing an operations and quality reporting system for a client. After the sudden departure of former manager Adam Wysocki, you inherit a team with fragile trust. In this version, the new manager begins by listening and setting ground rules, but tensions remain.')}</p><h3>${T('Odcinek 2 — Dwie wersje prawdy','Episode 2 — Two versions of the truth')}</h3><p>${T('W raporcie pojawia się sporna pozycja Q-17. Marta nie chce zatwierdzić wyników bez wystarczających testów. Robert naciska na termin obiecany klientowi. Tomasz obawia się opóźnienia wdrożenia. Julia ma dane sugerujące rozbieżności. W przyjętym wariancie kierownik nie wymusza podpisu, lecz organizuje wyjaśnienie faktów i ustala dalszą weryfikację. Konflikt formalnie przycicha, ale nikt nie ma poczucia, że wszystkie problemy rozwiązano.','Report item Q-17 becomes disputed. Marta refuses to approve results without adequate testing. Robert presses for the promised deadline. Tomasz fears rollout delays. Julia has data suggesting discrepancies. In this version, the manager does not force a signature, but arranges fact-finding and further verification. The formal conflict subsides, yet nobody feels everything has been resolved.')}</p><h3>${T('Teraz — Odcinek 3','Now — Episode 3')}</h3><p>${T('Trzy dni później tablica zadań jest zielona. Zespół przestał się spierać — i niemal przestał proponować usprawnienia. Twoim zadaniem nie jest wymusić entuzjazm, lecz rozpoznać przyczyny wycofania i odbudować warunki do sensownej inicjatywy.','Three days later the task board is green. The team has stopped arguing—and nearly stopped proposing improvements. Your task is not to demand enthusiasm, but to understand withdrawal and rebuild conditions for meaningful initiative.')}</p></div><h2>${T('Kartoteka postaci','Character files')}</h2><p>${T('Możesz wrócić do tych akt w dowolnej chwili, korzystając z przycisku „Akta postaci” u góry ekranu.','You can reopen these files at any time using the “Character files” button at the top.')}</p><div class="dossiergrid">${Object.keys(people).map(id=>`<div class="personcard"><img src="assets/${id}.webp" alt="${esc(people[id][0])}"><div class="details"><h3>${esc(people[id][0])}</h3><p>${esc(T(people[id][1],people[id][2]))}</p><p>${esc(T(people[id][3],people[id][4]))}</p></div></div>`).join('')}</div>${acts(B(T('Rozpocznij odcinek 3','Start episode 3'),'startStandalone')+B(T('Wróć do wyboru','Back to route selection'),'backRoute',false))}</div>`;
function renderScene(){if(S.entry==='prologue')return standalonePrologue();let n=S.step,a=DATA.scenes[n]||DATA.scenes[19];let body=`<div class="scene">${tag([[a[0],a[1]]])}`;
// Rebuild opening with standard header and scene-specific content.
body=`<div class="scene">${tag([a[0],a[1]])}<h${n===0?'1':'2'}>${T(a[2],a[3])}</h${n===0?'1':'2'}><p class="lead">${T(a[4],a[5])}</p>`;
if(n===0){body+=`<div class="panel"><h2>${T('Twoja droga przez NEXORĘ','Your route through NEXORA')}</h2><p>${T('Każda decyzja otwiera inną drogę do tego samego wyzwania: jak odbudować zaangażowanie zespołu?','Each choice opens a different path to the same challenge: how can the team’s engagement be rebuilt?')}</p><div class="actions">${B(T('Kontynuuję historię NEXORY','Continue my NEXORA story'),'continue')}${B(T('Gram tylko w ten odcinek','Play this episode only'),'standalone',false)}</div></div>`} 
else if(n===1){body+=`<div class="panel"><strong>${T('Kto jest kim?','Who is who?')}</strong><p>${T('Robert — dyrektor operacyjny, odpowiada za termin i klienta. Marta — specjalistka jakości, broni rzetelności testów. Tomasz — koordynator wdrożenia, odpowiada za tempo i obciążenie zespołu. Julia — analityczka, wcześniej zgłaszała rozbieżności raportów. Adam — poprzedni kierownik, którego odejście pozostaje niewyjaśnione. Ty — nowy kierownik, który musi odbudować inicjatywę bez ukrywania ryzyk.','Robert — operations director, responsible for deadlines and the client. Marta — quality specialist, concerned with test integrity. Tomasz — implementation coordinator, responsible for pace and workload. Julia — analyst who previously flagged report discrepancies. Adam — former manager whose departure remains unexplained. You — the new manager, tasked with rebuilding initiative without concealing risks.')}</p></div>`;body+=`<div class="paper"><strong>08:03 · NEXORA</strong><p>${T('Robert: „Chcę zobaczyć inicjatywę, nie tylko listę zadań”.','Robert: “I want to see initiative, not just a task list.”')}</p><p>${T('Julia (wersja robocza, niewysłana): „Po co mam to znowu poprawiać?”','Julia (unsent draft): “Why should I correct this again?”')}</p></div>`+portrait('julia')+acts(B(T('Podejmij decyzję','Make a decision')))}
else if(n===2||n===6||n===9){let key=n===2?'first':n===6?'talk':'plan';body+=optionButtons(key)+note('reason_'+key,T('Dlaczego wybierasz tę interwencję? Jakie ryzyko widzisz?',''),T('Why this intervention? What risk do you see?',''))+acts(B(T('Zatwierdź wybór','Confirm choice'),'decisionNext'))}
else if(n===3){let letter='ABCD'[S.decisions.first??0];if(S.mode==='class'){body+=`<div class="panel"><div style="font-size:3.5rem;font-weight:850;color:#ff647d">${letter}</div><p>${T('Zatrzymaj grę. Każda osoba podaje literę i uzasadnienie. Porównajcie, czy wybrana interwencja bada przyczyny, czy jedynie próbuje poprawić wynik. Następnie wróć do własnej rozgrywki.','Pause the game. Everyone shares their letter and rationale. Compare whether the intervention diagnoses causes or merely tries to improve results. Then return to your own game.')}</p></div>`}else{body+=portrait('anna')+`<p>${T('„Milczenie nie dowodzi braku motywacji. Sprawdź, czy pracownicy mogą bezpiecznie mówić o przeszkodach”.','“Silence does not prove a lack of motivation. Check whether staff can safely raise barriers.”')}</p>`+portrait('marek')+`<p>${T('„Termin jest realny. Sama rozmowa bez decyzji o priorytetach może tylko zwiększyć frustrację”.','“The deadline is real. A conversation without prioritisation may only increase frustration.”')}</p>`+portrait('karolina')+`<p>${T('„Pomyśl, jak zmierzysz zmianę. Więcej pomysłów nie zawsze oznacza mniejsze przeciążenie”.','“Think how you will measure change. More ideas do not always mean less overload.”')}</p>`}body+=note('perspective', 'Co Twoja decyzja może pomijać z perspektywy innej osoby?', 'What might your decision overlook from another person’s perspective?')+acts(B(T('Zobacz konsekwencje','See consequences'),'perspectiveNext'))}
else if(n===4||n===7||n===10){let key=n===4?'first':n===7?'talk':'plan';let idx=S.decisions[key]??0;body+=`<div class="panel"><p>${tr(DATA.outcomes[key][idx])}</p></div><p>${T('To możliwy skutek Twojej decyzji, nie ocena poprawności wybranej litery.','This is a possible consequence, not a grade for your chosen letter.')}</p>`+acts(B(T('Dalej','Continue')))}
else if(n===5){body+=portrait('marta')+portrait('julia')+portrait('tomasz')+`<div class="panel"><strong>${T('Zwróć uwagę','Notice')}</strong><p>${T('Niski poziom inicjatywy może wynikać z odmiennych barier: braku wpływu, informacji zwrotnej, zasobów lub przeciążenia. Nie przypisuj nikomu diagnozy.','Low initiative may reflect different barriers: limited influence, feedback, resources or overload. Do not diagnose anyone.')}</p></div>`+acts(B(T('Porozmawiaj z Julią','Talk to Julia')))}
else if(n===8){body+=`<div class="paper"><strong>${T('Notatka robocza · A. Wysocki','Draft note · A. Wysocki')}</strong><p>${T('„Wskaźnik mierzy to, co zdecydowaliśmy się pokazywać”.','“A metric measures what we decided to show.”')}</p></div>`+acts(B(T('Wybierz działanie','Choose an action')))}
else if(n===11){body+=`<div class="panel"><h3>${T('Motywacja wewnętrzna i zewnętrzna','Intrinsic and extrinsic motivation')}</h3><p>${T('Motywacja wewnętrzna: działanie wynikające z zainteresowania, wartości lub sensu zadania. Motywacja zewnętrzna: zachęty i presje spoza samego działania, np. nagrody lub sankcje. Ich znaczenie zależy od sytuacji; nie sprowadzaj pracowników do jednego motywatora.','Intrinsic motivation: action driven by interest, values or meaning. Extrinsic motivation: incentives and pressures external to the activity, such as rewards or sanctions. Their significance depends on context.')}</p><h3>${T('Diagnoza i indywidualizacja','Diagnosis and individualisation')}</h3><p>${T('Oddziel obserwację od interpretacji. Rozmawiaj o potrzebach i barierach; nie zakładaj motywacji na podstawie wieku ani milczenia. Dopasowanie wsparcia wymaga przejrzystych zasad.','Separate observations from interpretations. Discuss needs and barriers; do not infer motivation from age or silence. Tailored support needs transparent rules.')}</p><h3>${T('Rozmowa motywująca','Motivational conversation')}</h3><p>${T('Zacznij od konkretnej obserwacji i pytania otwartego. Uzgodnij wykonalny krok, wsparcie i termin przeglądu. Nie obiecuj tego, na co nie masz wpływu.','Start with a specific observation and an open question. Agree on a feasible step, support and review date. Do not promise what you cannot control.')}</p></div>`+acts(B(T('Dalej','Continue')))}
else if(n===12){body+=`<div class="panel"><h3>Job crafting</h3><p>${T('Przekształcanie zadań (task), relacji (relational) i sposobu rozumienia sensu pracy (cognitive). Lider może tworzyć przestrzeń do tych zmian, nie znosząc zależności i wymogów jakości.','Shaping tasks, relationships and the way work meaning is understood. Leaders can enable these changes without removing dependencies and quality requirements.')}</p><h3>${T('Proaktywność','Proactivity')}</h3><p>${T('Inicjatywa to nie nakaz „bądź proaktywny”. Potrzebuje informacji, możliwości działania i reakcji lidera, która nie karze za zgłaszanie ryzyka.','Initiative is not an order to “be proactive”. It needs information, agency and a leader response that does not punish risk reporting.')}</p><h3>${T('Przeciążenie i wypalenie','Overload and burnout')}</h3><p>${T('ICD-11 opisuje wypalenie jako zjawisko zawodowe związane z przewlekłym stresem w pracy: wyczerpanie, dystans lub cynizm oraz obniżone poczucie skuteczności. Nie diagnozuj pracowników; sprawdzaj obciążenie, zasoby i wsparcie.','ICD-11 describes burnout as an occupational phenomenon related to chronic workplace stress: exhaustion, distance or cynicism, and reduced efficacy. Do not diagnose staff; review workload, resources and support.')}</p><h3>${T('Sprawiedliwość','Fairness')}</h3><p>${T('Indywidualne potrzeby mogą wymagać różnych działań, ale kryteria, zakres odpowiedzialności i dostęp do rozmowy powinny być jawne.','Individual needs may require different actions, but criteria, accountability and access to dialogue should be transparent.')}</p></div>`+acts(B(T('Przejdź do testu','Go to quiz')))}
else if(n===13){let i=0;while(i<8&&S.quiz[i]?.done)i++;if(i===8){body+=`<p>${T('Wszystkie osiem obszarów zaliczone.','All eight areas completed.')}</p>`+acts(B(T('Otwórz pilną wiadomość','Open urgent message')))}else{let q=S.quiz[i]||{attempt:0,done:false};let area=DATA.areas[i],v=area[2][Math.min(2,q.attempt)];let order=i%3===0?[1,0,2]:i%3===1?[2,1,0]:[0,2,1];body=`<div class="scene">${tag([`TEST UCZĄCY · ${i+1}/8`,`LEARNING QUIZ · ${i+1}/8`])}<h2>${T(area[0],area[1])}</h2><p class="lead">${T(v[0],v[1])}</p>`;if(S.quizFeedback){body+=`<div class="panel" role="status"><strong>${T(S.quizFeedback.correct?'Dobrze!':'Spróbuj ponownie',S.quizFeedback.correct?'Correct!':'Try again')}</strong><p>${T(S.quizFeedback.pl,S.quizFeedback.en)}</p></div>`;body+=acts(B(T(S.quizFeedback.correct?'Następny obszar':'Kolejne pytanie',S.quizFeedback.correct?'Next area':'Try another question'),S.quizFeedback.correct?'quizContinue':'quizRetry'));if(S.quizFeedback.review)body+=`<p class="subtle">${T('Najpierw wróć do teorii.','Review the theory before retrying.')}</p>`}else{body+=order.map((j,k)=>`<button class="btn choice" data-quiz="${i}" data-answer="${j}"><strong>${'ABC'[k]}.</strong> ${esc(T(v[2+2*j],v[3+2*j]))}</button>`).join('')+`<div class="panel">${T('Po błędzie zobaczysz wyjaśnienie i alternatywne pytanie. Po trzech błędach wrócisz do teorii.','After a mistake you will see an explanation and an alternative question. After three mistakes, review the theory.')}</div>`}}}
else if(n===14){body+=portrait('julia')+portrait('marta')+`<div class="panel"><strong>${T('Robert','Robert')}</strong><p>${T('„Jeśli teraz zatrzymamy raport, jak mam to wytłumaczyć zarządowi?”','“If we stop the report now, how am I supposed to explain this to the board?”')}</p><strong>${T('Tomasz','Tomasz')}</strong><p>${T('„Nie każ ludziom po raz kolejny ratować harmonogramu kosztem nocy.”','“Do not make people rescue the schedule with another sleepless night.”')}</p></div><h3>${T('Twoja decyzja','Your decision')}</h3>`+DATA.finalChoices.map((c,i)=>`<button class="btn choice ${S.decisions.final===i?'selected':''}" data-choice="final" data-val="${i}"><strong>${'ABCD'[i]}.</strong> ${esc(T(c[0],c[1]))}</button>`).join('')+note('reason_final','Uzasadnij wybór: jak pogodzisz jakość, obciążenie i motywację zespołu?','Justify your choice: how will you balance quality, workload and team motivation?')+acts(B(T('Zobacz konsekwencje','See consequences'),'finalNext'))}
else if(n===15){const i=S.decisions.final??0;body+=`<div class="panel"><p>${T(DATA.finalOutcomes[i][0],DATA.finalOutcomes[i][1])}</p></div><p>${T('To możliwa konsekwencja Twojej decyzji. Zwróć uwagę, że odzyskanie głosu przez zespół nie musi oznaczać braku konfliktu.','This is a possible consequence of your decision. Notice that giving the team its voice back does not necessarily mean an absence of conflict.')}</p>`+acts(B(T('Przejdź do refleksji','Go to reflection')))}
else if(n===16){body+=note('reflection1','1. Jakie były trzy różne przyczyny wycofania bohaterów? Co jest faktem, a co hipotezą?','1. What were three different reasons for withdrawal? What is fact versus hypothesis?')+note('reflection2','2. Która Twoja decyzja mogła podkopać motywację? Jak ją zmienisz?','2. Which decision might have undermined motivation? How would you change it?')+note('reflection3','3. Zaproponuj dwa działania w ciągu tygodnia i mierzalne wskaźniki ich skuteczności.','3. Propose two actions within a week and measurable indicators of success.')+note('reflection4','4. Jak odróżnisz wspieranie proaktywności od dokładania pracy osobie przeciążonej?','4. How would you distinguish supporting proactivity from overloading someone?')+acts(B(T('Zapisz refleksję i kontynuuj','Save reflection and continue'),'reflectionNext'))}
else if(n===17){body+=`<div class="paper"><strong>${T('Nieznany nadawca','Unknown sender')} · 17:42</strong><p>${T('„Zapytaj, kto ustalił, co wolno oznaczyć na czerwono”.','“Ask who decided what could be marked red.”')}</p></div>`+acts(B(T('Przejdź do raportu','Go to report')))}
else if(n===18){body+=acts(B(T('Pobierz raport do PDF','Create PDF report'),'report')+B(T('Zapisz postęp do pliku','Save progress to file'),'save',false)+B(T('Zakończ odcinek','Finish episode'),'next',false))}
else if(n===19){body+=`<p>${T('Zapisz plik postępu. W kolejnym odcinku będziesz mogła/mógł wczytać historię poprzednich decyzji.','Save your progress file. In the next episode you can import your earlier decision history.')}</p>`+acts(B(T('Zapisz postęp','Save progress'),'save')+B(T('Strona główna','Home'),'home',false))}
return body+'</div>'}
function render(){document.documentElement.lang=S.lang;document.documentElement.style.setProperty('--size',S.font/100);$('fontval').textContent=S.font+'%';$('lang').textContent=S.lang==='pl'?'EN':'PL';$('about').textContent=T('O NEXORZE','About NEXORA');$('dossier').textContent=T('Akta postaci','Character files');$('episode').textContent=T('POD POWIERZCHNIĄ · ODCINEK 3','BELOW THE SURFACE · EPISODE 3');$('stage').innerHTML=renderScene();$('status').innerHTML=`${S.entry==='prologue'?T('Prolog','Prologue'):T('Etap','Stage')+' '+(S.step+1)+'/20'} · ${T('Tryb','Mode')}: <button class="smallbtn" type="button" data-act="mode" aria-label="${T('Zmień tryb rozgrywki','Change play mode')}">${S.mode==='class'?T('Zajęcia','Classroom'):T('Samodzielnie','Solo')}</button> · ${T('Zapis automatyczny w tej przeglądarce','Autosave in this browser')}`;$('nxHome').textContent=T('⌂ Strona główna','⌂ Home');$('nxSave').textContent=T('⇩ Zapisz postęp do pliku','⇩ Save progress to file');$('nxLoad').textContent=T('↥ Wznów grę z pliku','↥ Resume from file');$('nxExitTitle').textContent=T('Powrót na stronę główną','Return home');$('nxExitText').textContent=T('Czy chcesz zapisać postęp przed wyjściem?','Save progress before leaving?');$('nxSaveExit').textContent=T('Zapisz i wyjdź','Save and exit');$('nxExitWithout').textContent=T('Wyjdź bez zapisywania do pliku','Exit without downloading a save');$('nxCancel').textContent=T('Anuluj','Cancel');persist()}
function notice(pl,en){$('nxNotice').textContent=T(pl,en)}
function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function save(){const cumulative=[...(Array.isArray(S.parent?.cumulativeHistory)?S.parent.cumulativeHistory:(S.parent?[{episode:S.parent.episode||2,data:S.parent}]:[])),{episode:3,decisions:S.decisions,notes:S.notes,quiz:S.quiz,quizHistory:S.history}];download({...S,format:'nexora-progress',version:3,cumulativeHistory:cumulative,exportedAt:new Date().toISOString()},'nexora-odcinek-3-zapis.json');notice('Przygotowano plik zapisu — sprawdź Pobrane.','Save prepared — check Downloads.')}
function load(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(x?.episode===3){S={...fresh(),...x,font:Math.max(100,Math.min(200,Number(x.font)||100)),quizFeedback:null};notice('Wczytano zapis odcinka 3.','Episode 3 save loaded.')}else if(x?.episode===2){S={...fresh(),parent:x,lang:x.lang==='en'?'en':'pl',mode:x.mode==='solo'?'solo':'class',entry:'playing',route:'continuation',step:1};notice('Wczytano historię odcinka 2.','Episode 2 history loaded.')}else throw Error('wrong episode');render()}catch(e){notice('Nie można wczytać tego pliku. Wybierz zapis odcinka 2 lub 3.','Cannot read this file. Choose an episode 2 or 3 save.')}};reader.readAsText(file)}
function report(){let h=`<h1>NEXORA — ${T('Odcinek 3: Dlaczego przestali się starać?','Episode 3: Why did they stop trying?')}</h1><p>${new Date().toLocaleString()}</p><h2>${T('Decyzje i uzasadnienia','Decisions and rationales')}</h2>`;for(let key of ['first','talk','plan','final'])h+=`<h3>${esc(key)}: ${S.decisions[key]===undefined?'—':'ABCD'[S.decisions[key]]}</h3><p>${esc(S.notes['reason_'+key]||'—')}</p>`;h+=`<h2>${T('Konfrontacja perspektyw','Perspective challenge')}</h2><p>${esc(S.notes.perspective||'—')}</p><h2>${T('Refleksja','Reflection')}</h2>`;for(let i=1;i<=4;i++)h+=`<h3>${i}</h3><p>${esc(S.notes['reflection'+i]||'—')}</p>`;h+=`<h2>${T('Test wiedzy','Knowledge quiz')}</h2>`;for(let i=0;i<8;i++)h+=`<p>${esc(T(DATA.areas[i][0],DATA.areas[i][1]))}: ${S.quiz[i]?.done?T('zaliczony','completed'):T('nieukończony','unfinished')} · ${T('próby','attempts')}: ${(S.history[i]||[]).length}</p>`;h+=`<p>${T('Ocena jakościowa prowadzącego: teoria, analiza sytuacji, ryzyka, fakty a hipotezy, spójność argumentacji (0–2 pkt każde).','Instructor assessment: theory, situation analysis, risks, facts vs hypotheses, coherent reasoning (0–2 each).')}</p>`;let w=window.open('','_blank');if(!w){notice('Zezwól na wyskakujące okna, aby otworzyć raport.','Allow popups to open the report.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>NEXORA · Raport 3</title><style>body{font:15px/1.5 Arial,sans-serif;max-width:850px;margin:35px auto;color:#18222b}h1,h2{color:#9c2037}p{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px}@media print{button{display:none}}</style></head><body><button onclick="window.print()">${T('Drukuj / Zapisz jako PDF','Print / Save as PDF')}</button>${h}</body></html>`);w.document.close()}
function required(keys){for(let key of keys)if((S.notes[key]||'').trim().length<15){notice('Uzupełnij odpowiedź (minimum 15 znaków).','Complete the answer (minimum 15 characters).');return false}return true}
function action(a){if(a==='standalone'){S.entry='prologue';persist();render();return}if(a==='backRoute'){S.entry='choice';persist();render();return}if(a==='startStandalone'){S.entry='playing';S.route='standalone';S.step=1;persist();render();return}if(a==='continue'){S.entry='awaitingFile';$('file').click();return}if(a==='mode'){S.mode=S.mode==='class'?'solo':'class';persist();render();return}if(a==='import'){$('file').click();return}if(a==='class'||a==='solo'){S.mode=a;render();return}if(a==='save'){save();return}if(a==='home'){$('nxExit').showModal();return}if(a==='report'){report();return}if(a==='finalNext'){if(S.decisions.final===undefined){notice('Wybierz decyzję.','Choose a decision.');return}if(!required(['reason_final']))return;S.step=15;render();return}if(a==='decisionNext'){let key=S.step===2?'first':S.step===6?'talk':'plan';if(S.decisions[key]===undefined){notice('Najpierw wybierz odpowiedź.','Choose an option first.');return}if(!required(['reason_'+key]))return}if(a==='perspectiveNext'&&!required(['perspective']))return;if(a==='reflectionNext'&&!required(['reflection1','reflection2','reflection3','reflection4']))return;if(a==='quizContinue'||a==='quizRetry'){if(a==='quizContinue'&&S.quizFeedback?.correct){const i=S.quizFeedback.area;if(Number.isInteger(i)){S.quiz[i]={...(S.quiz[i]||{}),done:true}}}if(a==='quizRetry'&&S.quizFeedback?.review){S.quizFeedback=null;S.step=11;render();return}S.quizFeedback=null;render();return}if(a==='reviewTheory'){S.quizFeedback=null;S.step=11;render();return}if(a==='next'||a==='decisionNext'||a==='perspectiveNext'||a==='reflectionNext'){S.step=Math.min(19,S.step+1);render()}}
$('status').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)action(b.dataset.act)});
$('stage').addEventListener('input',e=>{if(e.target.dataset.note){S.notes[e.target.dataset.note]=e.target.value;persist()}});
$('stage').addEventListener('click',e=>{let ch=e.target.closest('[data-choice]');if(ch){S.decisions[ch.dataset.choice]=Number(ch.dataset.val);render();return}let q=e.target.closest('[data-quiz]');if(q){let i=Number(q.dataset.quiz),answer=Number(q.dataset.answer),state=S.quiz[i]||{attempt:0,done:false},v=DATA.areas[i][2][Math.min(2,state.attempt)];S.history[i]??=[];S.history[i].push({question:T(v[0],v[1]),correct:answer===0,attempt:state.attempt+1});if(answer===0){S.quiz[i]={done:false,attempt:state.attempt};S.quizFeedback={correct:true,area:i,pl:v[8],en:v[9]}}else{let attempt=state.attempt+1;S.quiz[i]={done:false,attempt:Math.min(2,attempt)};S.quizFeedback={correct:false,review:attempt>=3,pl:v[8]+' '+(attempt>=3?'Wróć do teorii i spróbuj ponownie.':'Otrzymasz kolejne pytanie.'),en:v[9]+' '+(attempt>=3?'Review theory and try again.':'You will get another question.')};if(attempt>=3)S.quiz[i].attempt=0}render();return}let b=e.target.closest('[data-act]');if(b)action(b.dataset.act)});
$('about').onclick=()=>{$('modalTitle').textContent=T('O NEXORZE','About NEXORA');$('modalBody').innerHTML=`<p>${T('NEXORA to fikcyjna firma wdrażająca system raportowania jakości i operacji. Wcześniejszy kierownik Adam odszedł w niejasnych okolicznościach. W odcinku 3 badasz przyczyny wycofania i spadku inicjatywy po konflikcie o raport Q-17.','NEXORA is a fictional company implementing an operations and quality reporting system. Previous manager Adam left under unclear circumstances. In episode 3 you explore withdrawal and declining initiative after the Q-17 dispute.')}</p>`;$('modal').showModal()};
$('dossier').onclick=()=>{$('modalTitle').textContent=T('Akta postaci','Character files');$('modalBody').innerHTML=`<div class="character"><div><strong>${T('TY — NOWY KIEROWNIK','YOU — NEW MANAGER')}</strong><p>${T('Twoja tożsamość i wcześniejsze decyzje należą do Ciebie.','Your identity and earlier decisions belong to you.')}</p></div></div>`+Object.keys(people).map(portrait).join('');$('modal').showModal()};
$('closeModal').onclick=()=>$('modal').close();$('lang').onclick=()=>{S.lang=S.lang==='pl'?'en':'pl';render()};$('smaller').onclick=()=>{S.font=Math.max(100,S.font-10);render()};$('bigger').onclick=()=>{S.font=Math.min(200,S.font+10);render()};$('reset').onclick=()=>{if(confirm(T('Rozpocząć od nowa? Obecny postęp w przeglądarce zostanie zastąpiony.','Start over? Current browser progress will be replaced.'))){S=fresh();render()}};
$('nxHome').onclick=()=>{$('nxExit').showModal()};$('nxSave').onclick=save;$('nxLoad').onclick=()=>$('file').click();$('file').onchange=e=>{if(e.target.files[0])load(e.target.files[0]);e.target.value=''};$('nxSaveExit').onclick=()=>{save();location.href='../'};$('nxExitWithout').onclick=()=>location.href='../';$('nxCancel').onclick=()=>$('nxExit').close();
render();
</script></body></html>
